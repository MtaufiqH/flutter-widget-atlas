const ENVS={dev:{n:'Shop Dev',url:'https://dev.api.example.com',id:'com.example.shop.dev',c:'#e8590c'},staging:{n:'Shop Staging',url:'https://staging.api.example.com',id:'com.example.shop.staging',c:'#7048e8'},prod:{n:'Shop',url:'https://api.example.com',id:'com.example.shop',c:'#1971c2'}};

def({cat:FR,id:'flavors-env',name:'Flavors and environments (dev, staging, prod)',tags:'flavor environment dev staging prod dart-define dart-define-from-file fromenvironment productflavors scheme applicationid base url config build variant api key secret',h:430,
blurb:'Most apps need the same code to run against different servers: dev, staging and production. You pass the settings when you build. A --dart-define value becomes a compile-time constant. Native flavors also change the app name, id and icon, so all three can be installed on one phone.',
use:'Testing against a staging server, keeping test data away from production, and installing dev and prod builds side by side.',
watch:'Values from --dart-define are inside the app and can be extracted, so they are not secrets. Never put real secret keys in the app. Use a default that is safe (never default to production while testing). Native flavors need setup on both Android (productFlavors) and iOS (schemes and xcconfig).',
ctl:[{k:'env',l:'environment',t:'sel',o:['dev','staging','prod'],v:'dev'},{k:'how',l:'method',t:'sel',o:['--dart-define','--dart-define-from-file','native flavors'],v:'--dart-define'}],
render(s,st,g,d){
 const e=ENVS[s.env],nat=s.how==='native flavors';
 const cmd=s.how==='--dart-define'?`flutter run --dart-define=ENV=${s.env} --dart-define=API_URL=${e.url}`:s.how==='--dart-define-from-file'?`flutter run --dart-define-from-file=config/${s.env}.json`:`flutter run --flavor ${s.env} -t lib/main_${s.env}.dart`;
 g.innerHTML=nbx(`<div style="font:12px/1.5 var(--f-mono);background:var(--code-bg);color:var(--code-fg);padding:8px 10px;border-radius:8px;overflow-wrap:anywhere">$ ${esc(cmd)}</div>${narrow}<div style="border:1.5px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden"><div style="background:${e.c};color:#fff;padding:7px 12px;font:700 12px var(--f-mono);display:flex;justify-content:space-between"><span>${esc(nat?e.n:'Shop')}</span><span>${s.env.toUpperCase()}</span></div><div style="padding:10px 12px;font:12px/1.7 var(--f-mono)"><b>API_URL</b> ${esc(e.url)}<br><b>app id</b> ${esc(nat?e.id:'com.example.shop (same for all)')}<br><b>installs</b> ${nat?'side by side with the other builds':'replaces the other build on the phone'}<br><b>app name</b> ${esc(nat?e.n:'Shop (same for all)')}</div></div><div style="font-size:12px;color:var(--muted)">${nat?'Native flavors change the name, id and icon, so dev and prod can both be installed.':'Only Dart values change. The app id, name and icon stay the same.'}</div>`);
 const dart=`// lib/config.dart\nclass Config {\n  static const env = String.fromEnvironment('ENV', defaultValue: 'dev');\n  static const apiUrl = String.fromEnvironment(\n    'API_URL',\n    defaultValue: 'https://dev.api.example.com',   // safe default\n  );\n  static bool get isProd => env == 'prod';\n}\n\n// use it\nfinal dio = Dio(BaseOptions(baseUrl: Config.apiUrl));`;
 const extra={'--dart-define':`\n\n// run, build and CI all pass the same flags\nflutter build apk --dart-define=ENV=prod --dart-define=API_URL=https://api.example.com`,'--dart-define-from-file':`\n\n// config/${s.env}.json  (keep out of git if it has anything private)\n// {\n//   "ENV": "${s.env}",\n//   "API_URL": "${e.url}"\n// }\nflutter build apk --dart-define-from-file=config/prod.json`,'native flavors':`\n\n// android/app/build.gradle.kts\nandroid {\n  flavorDimensions += "env"\n  productFlavors {\n    create("dev") {\n      dimension = "env"\n      applicationIdSuffix = ".dev"\n      resValue("string", "app_name", "Shop Dev")\n    }\n    create("staging") {\n      dimension = "env"\n      applicationIdSuffix = ".staging"\n      resValue("string", "app_name", "Shop Staging")\n    }\n    create("prod") {\n      dimension = "env"\n      resValue("string", "app_name", "Shop")\n    }\n  }\n}\n// AndroidManifest: android:label="@string/app_name"\n\n// iOS: in Xcode, duplicate the Runner scheme for each flavor\n// (names must match: Debug-dev, Release-dev ...), and set a\n// different bundle id and display name in an .xcconfig file.\n\n// one entry file per flavor (optional)\n// lib/main_dev.dart:  void main() => bootstrap(Config.dev);`};
 return {code:dart+extra[s.how],hint:'Switch the environment and the method. Only native flavors change the app name and id. The Gradle syntax differs between Flutter versions, so check the current flavors docs.'};
}});

def({cat:FR,id:'app-icons',name:'App icon and name per flavor',tags:'app icon launcher icon flutter_launcher_icons adaptive icon android ios flavor badge name label mipmap appiconset splash native splash',h:400,
blurb:'The app icon is not a Flutter widget. It is a set of native image files in the Android and iOS projects. The flutter_launcher_icons package creates all the sizes from one source image, and can make a separate set for each flavor, so testers can tell dev from prod.',
use:'Setting your real icon, and marking dev and staging builds with a coloured badge.',
watch:'Start with a 1024 by 1024 PNG. iOS icons must not have transparency. Android adaptive icons need a separate foreground and background, and the system may crop them into a circle or a squircle, so keep the logo in the centre. Run the tool again after you change the image.',
ctl:[{k:'env',l:'flavor',t:'sel',o:['dev','staging','prod'],v:'dev'},{k:'ad',l:'Android adaptive icon',t:'chk',v:true},{k:'shape',l:'launcher shape',t:'sel',o:['circle','squircle','square'],v:'circle'}],
render(s,st,g,d){
 const e=ENVS[s.env];const br=s.ad?{circle:'50%',squircle:'30%',square:'8%'}[s.shape]:'22%';
 const icon=(c,lab,badge)=>`<div style="text-align:center"><div style="width:78px;height:78px;margin:0 auto;border-radius:${br};background:${c};display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.25)"><div style="width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.92)"></div>${badge?`<div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.6);color:#fff;font:700 9px var(--f-mono);padding:2px 0">${badge}</div>`:''}</div><div style="font-size:11.5px;margin-top:5px">${lab}</div></div>`;
 g.innerHTML=nbx(`<div style="display:flex;justify-content:space-around;padding:14px 0">${Object.entries(ENVS).map(([k,v])=>icon(v.c,v.n,k==='prod'?'':k.toUpperCase())).join('')}</div><div style="font-size:12.5px;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)">${s.ad?'Android adaptive icon: the system masks the foreground into a '+s.shape+'. Keep the logo near the centre.':'A single image. iOS rounds the corners itself and does not allow transparency.'}<br>Selected: <b>${esc(e.n)}</b></div>`);
 const code=`# pubspec.yaml\ndev_dependencies:\n  flutter_launcher_icons: ^0.14.0   # check the latest version\n\n# flutter_launcher_icons-${s.env}.yaml  (one file per flavor)\nflutter_launcher_icons:\n  android: "launcher_icon"\n  ios: true\n  image_path: "assets/icon/icon_${s.env}.png"       # 1024x1024\n  remove_alpha_ios: true                    # iOS: no transparency\n${s.ad?`  adaptive_icon_background: "${e.c}"\n  adaptive_icon_foreground: "assets/icon/foreground.png"   # logo on transparent\n`:''}\n# generate\ndart run flutter_launcher_icons -f flutter_launcher_icons-${s.env}.yaml\n\n# the app name is not part of the icon:\n# Android: resValue("string", "app_name", "${e.n}") in the flavor\n# iOS: CFBundleDisplayName in Info.plist or the flavor's .xcconfig`;
 return {code,hint:'Compare the three flavors. A badge on dev and staging stops people mixing them up. Check the package README for its current options.'};
}});

def({cat:PF,id:'perf-rebuild',name:'const and rebuild scope',tags:'performance const constructor rebuild setstate scope valuelistenablebuilder split widget build method jank repaint optimization stateful small widgets',h:400,
blurb:'When setState runs, Flutter calls build again for that widget and its children. That is cheap for small trees but wasteful for big ones. You can make it cheaper in three ways: mark unchanging widgets const, move the changing part into its own small widget, or listen to a ValueNotifier.',
use:'Screens that update often (timers, counters, typing) and have large parts that never change.',
watch:'Do not optimise before you measure. A rebuild is not a repaint, and Flutter is fast at rebuilding. Splitting into small widgets (not helper methods) is the best habit. Use the lints prefer_const_constructors and prefer_const_literals_to_create_immutables.',
ctl:[{k:'fix',l:'approach',t:'sel',o:['setState on the whole screen','const children','split into a small widget','ValueListenableBuilder'],v:'setState on the whole screen'}],
render(s,st,g,d){
 if(!st.c)st.c=[0,0,0,0];
 const R={'setState on the whole screen':[1,1,1,1],'const children':[1,0,0,1],'split into a small widget':[0,0,0,1],'ValueListenableBuilder':[0,0,0,1]}[s.fix];
 const N=[['Screen.build','Scaffold, AppBar'],['Header','const Text, Image'],['BigList','1,000 rows'],['Counter text','the value']];
 const tot=st.c.reduce((a,b)=>a+b,0);
 g.innerHTML=nbx(`<div>${nbtn('tick','Tick (+1)','Filled')} ${nbtn('reset','Reset')}</div>${N.map((n,i)=>`<div style="display:flex;align-items:center;gap:8px;border:1.5px solid ${st.c[i]?'var(--c1)':'var(--line)'};border-radius:8px;padding:6px 10px;background:var(--surface)"><div style="flex:1"><div style="font:600 12px var(--f-mono)">${n[0]}</div><div style="font-size:11.5px;color:var(--muted)">${n[1]}</div></div><div style="font:700 16px var(--f-mono);color:${i===2&&st.c[i]?'var(--danger)':'var(--text)'}">${st.c[i]}</div><div style="font-size:11px;color:var(--muted)">builds</div></div>`).join('')}<div style="font-size:12px;color:var(--muted)">Total builds: <b>${tot}</b>. The 1,000-row list is the expensive one.</div>`);

 const C={'setState on the whole screen':`class _ScreenState extends State<Screen> {\n  int n = 0;\n  @override\n  Widget build(BuildContext context) {\n    return Scaffold(\n      body: Column(children: [\n        Header(),            // rebuilt on every tick\n        BigList(),           // rebuilt on every tick\n        Text('$n'),\n        ElevatedButton(onPressed: () => setState(() => n++), child: Text('Tick')),\n      ]),\n    );\n  }\n}`,'const children':`body: Column(children: [\n  const Header(),        // const: Flutter skips it\n  const BigList(),       // const: skipped, even though build runs\n  Text('$n'),\n  ElevatedButton(onPressed: () => setState(() => n++), child: const Text('Tick')),\n]),\n// Screen.build still runs, but const children are not rebuilt.`,'split into a small widget':`// the changing part owns its own state\nclass TickCounter extends StatefulWidget {\n  const TickCounter({super.key});\n  @override\n  State<TickCounter> createState() => _TickCounterState();\n}\nclass _TickCounterState extends State<TickCounter> {\n  int n = 0;\n  @override\n  Widget build(BuildContext context) => Row(children: [\n    Text('$n'),\n    ElevatedButton(onPressed: () => setState(() => n++), child: const Text('Tick')),\n  ]);\n}\n// Screen is now stateless: setState only rebuilds TickCounter.`,'ValueListenableBuilder':`final n = ValueNotifier<int>(0);   // dispose it in State.dispose\n\nbody: Column(children: [\n  const Header(),\n  const BigList(),\n  ValueListenableBuilder<int>(\n    valueListenable: n,\n    builder: (_, value, __) => Text('$value'),   // only this rebuilds\n  ),\n  ElevatedButton(onPressed: () => n.value++, child: const Text('Tick')),\n]),`}[s.fix];
 return {code:C,hint:'Press Tick a few times with each approach. The numbers show how many times each part was built. Change the approach and press Reset.'};
},
act(a,st,s){
 if(a==='reset'){st.c=[0,0,0,0];return}
 if(a==='tick'){const R={'setState on the whole screen':[1,1,1,1],'const children':[1,0,0,1],'split into a small widget':[0,0,0,1],'ValueListenableBuilder':[0,0,0,1]}[s.fix];st.c=st.c.map((x,i)=>x+R[i])}
}});

def({cat:PF,id:'perf-lists',name:'Long lists: ListView.builder',tags:'listview builder lazy itemcount itemextent separated sliver performance long list children memory findchildindexcallback shrinkwrap physics',h:380,
blurb:'ListView(children: [...]) builds every item at once, even the ones nobody sees. ListView.builder builds only the items on screen (plus a few extra) and builds more as you scroll.',
use:'Any list with more than a few dozen items, or a list that comes from a server or a database.',
watch:'Use ListView.builder (or .separated) for anything long. Never put a ListView inside a Column without Expanded, and avoid shrinkWrap: true on long lists because it builds everything again. Setting itemExtent or prototypeItem saves layout work. Keep each item\'s build cheap.',
ctl:[{k:'kind',l:'list type',t:'sel',o:['ListView(children)','ListView.builder'],v:'ListView(children)'},{k:'n',l:'items',t:'sel',o:['100','10,000','1,000,000'],v:'10,000'},{k:'ext',l:'itemExtent set',t:'chk',v:false}],
render(s,st,g,d){
 const n={'100':100,'10,000':10000,'1,000,000':1000000}[s.n];
 const b=s.kind==='ListView.builder';const built=b?14:n;
 const ms=b?(s.ext?1.5:2.5):Math.round(n*0.05*10)/10;
 const bar=(v,col)=>`<div style="height:16px;border-radius:5px;background:${col};width:${Math.max(2,Math.min(100,Math.log10(v+1)/6*100))}%"></div>`;
 g.innerHTML=nbx(`<div style="font:600 10.5px var(--f-mono);color:var(--muted)">WIDGETS BUILT (log scale)</div>${bar(built,b?'var(--ok)':'var(--danger)')}<div style="font:700 15px var(--f-mono)">${built.toLocaleString('en-US')}${b?' (about what fits on screen)':''}</div><div style="font:600 10.5px var(--f-mono);color:var(--muted);margin-top:6px">ROUGH TIME BEFORE THE FIRST FRAME</div>${bar(ms*1000,b?'var(--ok)':'var(--danger)')}<div style="font:700 15px var(--f-mono)">~${ms>=1000?(ms/1000).toFixed(1)+' s':ms+' ms'}</div><div style="font-size:12px;color:var(--muted);margin-top:auto">An illustration, not a measurement. Real numbers depend on the item and the device. Use DevTools to measure your own list.${!b&&n>=10000?'<br><b style="color:var(--danger)">Do not do this with this many items.</b>':''}</div>`);
 const code=b?`ListView.builder(\n  itemCount: items.length,${s.ext?'\n  itemExtent: 72,               // fixed height: no need to measure items':''}\n  itemBuilder: (context, index) {\n    final item = items[index];   // called only for visible rows\n    return ListTile(title: Text(item.name));\n  },\n);\n\n// with dividers\nListView.separated(\n  itemCount: items.length,\n  separatorBuilder: (_, __) => const Divider(height: 1),\n  itemBuilder: (_, i) => ItemTile(items[i]),\n);`:`ListView(\n  children: [\n    for (final item in items)          // creates ${n.toLocaleString('en-US')} widgets now\n      ListTile(title: Text(item.name)),\n  ],\n);\n\n// fine for a short, fixed list (a settings page).\n// For long or growing data, use ListView.builder.`;
 return {code,hint:'Compare the two list types as the item count grows. The builder\'s cost stays the same.'};
}});

def({cat:PF,id:'perf-images',name:'Image size and caching',tags:'image cachewidth cacheheight resizeimage cached_network_image imagecache memory decode precacheimage thumbnail network asset oom performance bytes',h:400,
blurb:'A picture takes memory based on its pixels, not its file size. A 4000 by 3000 photo needs about 48 MB once decoded, even when it is drawn in an 80 pixel box. Ask Flutter to decode it smaller with cacheWidth, and cache network images so they are not downloaded again.',
use:'Photo lists, galleries, avatars, and any screen that shows many images.',
watch:'Decoded size is width x height x 4 bytes. Thumbnails should be decoded at thumbnail size. cacheWidth in pixels is the logical size times the device pixel ratio. Flutter\'s in-memory image cache has size limits, so very large images are evicted quickly. Ask your server for a thumbnail size when it supports one.',
ctl:[{k:'src',l:'how images are loaded',t:'sel',o:['full size, no cacheWidth','cacheWidth set','cached_network_image + cacheWidth'],v:'full size, no cacheWidth'},{k:'px',l:'shown size (logical px)',t:'rng',min:40,max:200,step:20,v:80},{k:'n',l:'images on the list',t:'sel',o:['20','100'],v:'20'}],
render(s,st,g,d){
 const dpr=3,n=+s.n,full=4000*3000*4;
 const small=s.src!=='full size, no cacheWidth';
 const w=s.px*dpr,h=Math.round(w*0.75);const per=small?w*h*4:full;
 const tot=per*n;const mb=v=>v>=1048576?(v/1048576).toFixed(v>=1e8?0:1)+' MB':Math.round(v/1024)+' KB';
 const danger=tot>400*1048576;
 g.innerHTML=nbx(`<div style="font:600 10.5px var(--f-mono);color:var(--muted)">DECODED MEMORY PER IMAGE</div><div style="font:700 17px var(--f-mono)">${mb(per)}</div><div style="font:12px var(--f-mono);color:var(--muted)">${small?w+' x '+h+' x 4 bytes':'4000 x 3000 x 4 bytes'}</div><div style="font:600 10.5px var(--f-mono);color:var(--muted);margin-top:6px">${n} IMAGES</div><div style="height:18px;border-radius:5px;background:${danger?'var(--danger)':'var(--ok)'};width:${Math.max(2,Math.min(100,Math.log10(tot/1024+1)/6.2*100))}%"></div><div style="font:700 17px var(--f-mono);color:${danger?'var(--danger)':'var(--text)'}">${mb(tot)}${danger?' &mdash; the app may be killed':''}</div><div style="font-size:12px;color:var(--muted);margin-top:auto">${s.src.startsWith('cached')?'Also saved on disk: the next visit does not download the images again.':'Estimates, with a pixel ratio of 3. Not every image is in memory at once, but a list of large photos gets close.'}</div>`);
 const lines={'full size, no cacheWidth':`Image.network(\n  url,\n  width: ${s.px},\n  height: ${s.px},\n  fit: BoxFit.cover,\n);   // decodes the full 4000 x 3000 picture`,'cacheWidth set':`Image.network(\n  url,\n  width: ${s.px},\n  height: ${s.px},\n  fit: BoxFit.cover,\n  cacheWidth: (${s.px} * MediaQuery.devicePixelRatioOf(context)).round(),\n);   // decoded at the size it is drawn`,'cached_network_image + cacheWidth':`// pubspec: cached_network_image\nCachedNetworkImage(\n  imageUrl: url,\n  width: ${s.px},\n  height: ${s.px},\n  fit: BoxFit.cover,\n  memCacheWidth: (${s.px} * MediaQuery.devicePixelRatioOf(context)).round(),\n  placeholder: (_, __) => const ColoredBox(color: Colors.black12),\n  errorWidget: (_, __, ___) => const Icon(Icons.broken_image),\n);   // also keeps a copy on disk`};
 return {code:lines[s.src]+`\n\n// assets: same idea\nImage.asset('assets/photo.jpg', cacheWidth: 300);\n// load a screen's first images early\nprecacheImage(const AssetImage('assets/hero.jpg'), context);`,hint:'Change how images load and how many are shown. Decoded size, not file size, is what fills memory.'};
}});

def({cat:PF,id:'devtools',name:'Find slow code with DevTools',tags:'devtools profile mode performance overlay timeline cpu profiler memory widget inspector track rebuilds jank frame raster ui thread analyze-size app size debug release observatory',h:400,
blurb:'DevTools shows where time and memory go. The first rule: measure in profile mode on a real phone. Debug mode is much slower and its numbers mean nothing. Pick the tool that matches the symptom.',
use:'Whenever the app feels slow, uses too much memory, or the build is large. Measure first, then change code.',
watch:'Never judge performance from an emulator in debug mode. Look at the frame chart: red bars are frames that took too long. A tall UI-thread bar means your Dart build or layout is slow. A tall raster bar means painting is heavy (shadows, blur, saveLayer). Fix one thing, then measure again.',
ctl:[{k:'sym',l:'what you see',t:'sel',o:['scrolling is janky','app starts slowly','memory keeps growing','too many rebuilds','the app is too big'],v:'scrolling is janky'}],
render(s,st,g,d){
 const T={'scrolling is janky':['Performance tab','Frame chart: find red frames. Tall UI bar = slow build or layout. Tall raster bar = heavy painting.','Use ListView.builder, const widgets, smaller images, fewer saveLayer (Opacity, ClipRRect on big areas).'],
 'app starts slowly':['CPU Profiler','Record from launch. Look at the call tree for long calls in main() and the first build.','Delay work: load data after the first frame, avoid big JSON parsing on the main isolate, init plugins lazily.'],
 'memory keeps growing':['Memory tab','Take snapshots before and after a screen. Compare them. Instances that should be gone are leaks.','Dispose controllers, cancel streams and timers, remove listeners, shrink image sizes.'],
 'too many rebuilds':['Widget Inspector','Turn on "Track widget rebuilds". Widgets that flash often rebuild often.','Move setState lower, use const, split widgets, use select or ValueListenableBuilder.'],
 'the app is too big':['App Size tool','Run a build with --analyze-size and open the JSON file in the tool to see what takes space.','Compress images, remove unused packages and fonts, use App Bundle and --split-debug-info.']}[s.sym];
 g.innerHTML=nbx(ncard('OPEN',`<b>${esc(T[0])}</b>`,1)+narrow+ncard('LOOK FOR',esc(T[1]),0)+narrow+ncard('THEN TRY',esc(T[2]),0)+`<div style="margin-top:auto;font-size:12px;color:var(--muted)">Run in <b>profile mode</b> on a real device. Debug mode adds a lot of overhead.</div>`);
 const code=`# run in profile mode on a real phone, then open DevTools\nflutter run --profile\ndart devtools\n\n# size report, then open the json in DevTools > App Size\nflutter build apk --analyze-size\n\n# quick checks in code\nMaterialApp(showPerformanceOverlay: true);        // two frame graphs on screen\n// debugPrintRebuildDirtyWidgets = true;          // print every rebuilt widget (debug only)\n\n// measure your own code\nfinal sw = Stopwatch()..start();\nawait loadData();\ndebugPrint('loadData took \${sw.elapsedMilliseconds} ms');\n\n// move heavy work off the UI isolate\nfinal list = await compute(parseUsers, jsonString);`;
 return {code,hint:'Choose the symptom to see which DevTools tab to open and what to try. The menu names in DevTools can change between versions.'};
}});

const stepsDemo=(g,steps,cur,who,never)=>{g.innerHTML=nbx(steps.map((t,i)=>`<div style="display:flex;gap:8px;align-items:center;border:1.5px solid ${i===cur?'var(--c1)':'var(--line)'};background:${i===cur?'var(--c1s)':'var(--surface)'};border-radius:8px;padding:6px 10px"><div style="width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font:700 11px var(--f-mono);background:${i<cur?'var(--ok)':i===cur?'var(--c1)':'var(--line)'};color:#fff">${i<cur?'&#10003;':i+1}</div><div style="flex:1;font-size:12.5px">${esc(t)}</div><div style="font:11px var(--f-mono);color:var(--muted)">${esc(who[i])}</div></div>`).join('')+(never?`<div style="margin-top:auto" class="erb">${never}</div>`:''))};

def({cat:FR,id:'release-android',name:'Android release: signing and App Bundle',tags:'android release signing keystore keytool key.properties appbundle aab apk play console upload key play app signing versioncode obfuscate split-debug-info gradle release build',h:430,
blurb:'To publish on Google Play you sign the app with a key, build an Android App Bundle (.aab), and upload it. Play then makes the right APK for each phone. The key proves that updates come from you.',
use:'Shipping an Android app to testers or to the Play Store.',
watch:'Back up your keystore and passwords. If you lose the upload key you must ask Google to reset it. Never commit the keystore or key.properties to git. Increase the build number in pubspec (the number after +) for each upload. Test the release build on a real phone, because it behaves differently from debug. Gradle files change between Flutter versions, so check the current Android deployment docs.',
ctl:[{k:'step',l:'step',t:'sel',o:['1 Create a keystore','2 key.properties','3 Gradle signing','4 Build the bundle','5 Upload to Play'],v:'1 Create a keystore'}],
render(s,st,g,d){
 const i=+s.step[0]-1;
 stepsDemo(g,['Create an upload keystore','Put the passwords in key.properties','Tell Gradle to sign release builds','Build the .aab file','Upload and test on Google Play'],i,['once','once','once','each release','each release'],'Never commit upload-keystore.jks or key.properties. Add key.properties to .gitignore.');
 const C=[`# 1. once per app. Keep the file safe and backed up.\nkeytool -genkey -v -keystore ~/upload-keystore.jks \\\n  -keyalg RSA -keysize 2048 -validity 10000 -alias upload`,`# 2. android/key.properties  (add it to .gitignore)\nstorePassword=<password from step 1>\nkeyPassword=<password from step 1>\nkeyAlias=upload\nstoreFile=/Users/you/upload-keystore.jks`,`// 3. android/app/build.gradle.kts (Groovy in older projects)\nimport java.util.Properties\nimport java.io.FileInputStream\n\nval keystoreProperties = Properties()\nval keystorePropertiesFile = rootProject.file("key.properties")\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n}\n\nandroid {\n    signingConfigs {\n        create("release") {\n            keyAlias = keystoreProperties["keyAlias"] as String\n            keyPassword = keystoreProperties["keyPassword"] as String\n            storeFile = keystoreProperties["storeFile"]?.let { file(it) }\n            storePassword = keystoreProperties["storePassword"] as String\n        }\n    }\n    buildTypes {\n        release { signingConfig = signingConfigs.getByName("release") }\n    }\n}`,`# 4. pubspec.yaml: version: 1.2.0+7   (1.2.0 is shown, 7 is the build number)\nflutter build appbundle --release\n# output: build/app/outputs/bundle/release/app-release.aab\n\n# smaller and harder to read, keep the symbols for crash reports\nflutter build appbundle --obfuscate --split-debug-info=build/symbols\n\n# test the release build on a phone\nflutter run --release`,`# 5. Google Play Console\n# - create the app, accept Play App Signing\n#   (your upload key signs the upload, Google holds the final signing key)\n# - fill in the store listing, privacy policy and Data safety form\n# - upload the .aab to Internal testing first\n# - fix the pre-launch report, then promote to Production`];
 return {code:C[i],hint:'Step through the five steps. Steps 1 to 3 are done once. Steps 4 and 5 repeat for every release.'};
}});

def({cat:FR,id:'push-notifications',name:'Push notifications with Firebase (FCM)',tags:'push notification firebase fcm firebase_messaging apns token onmessage onbackgroundmessage getinitialmessage onmessageopenedapp data message notification payload local notifications permission post_notifications',h:430,
blurb:'With Firebase Cloud Messaging (FCM), your server sends a message to Google, and Google delivers it to the phone (through Apple\'s APNs on iOS). Which part of your code runs depends on the app state (foreground, background or closed) and on the kind of message.',
use:'Chat messages, order updates, reminders, and any alert you send from a server.',
watch:'Ask for permission on iOS and on Android 13 and above. Send the device token to your server and refresh it when it changes. The background handler must be a top-level function. A foreground app does not show a notification by itself, so show your own with flutter_local_notifications. Data-only messages on iOS are not reliable when the app is closed. Set up the APNs key in the Firebase console. Check the FlutterFire docs for current steps.',
ctl:[{k:'app',l:'app state when the message arrives',t:'sel',o:['foreground','background','terminated'],v:'foreground'},{k:'pl',l:'message kind',t:'sel',o:['notification message','data-only message'],v:'notification message'}],
render(s,st,g,d){
 const n=s.pl[0]==='n',fg=s.app==='foreground',bg=s.app==='background';

use:'ViewModels, repositories, parsers, validators and any logic that does not need widgets.',
watch:'Test behaviour, not the code line by line. Give each test one reason to fail. Use a hand-written fake for simple cases, and mocktail when you need to check which calls were made. Do not use the real network or database in a unit test. Await async code, or the test ends before the result.',
ctl:[{k:'case',l:'scenario',t:'sel',o:['server returns 2 todos','server fails','server returns nothing'],v:'server returns 2 todos'},{k:'bug',l:'bug in the ViewModel',t:'chk',v:false},{k:'tool',l:'fake made with',t:'sel',o:['hand-written fake','mocktail'],v:'hand-written fake'}],

 const fake=s.tool==='mocktail'?`class MockRepo extends Mock implements TodoRepository {}\n\nvoid main() {\n  late MockRepo repo;\n  late TodosViewModel vm;\n  setUp(() {\n    repo = MockRepo();\n    vm = TodosViewModel(repo);\n  });\n\n  test('${s.case}', () async {\n    ${s.case.includes('fails')?'when(() => repo.todos()).thenThrow(const NetworkException());':s.case.includes('nothing')?'when(() => repo.todos()).thenAnswer((_) async => []);':"when(() => repo.todos()).thenAnswer((_) async => [Todo('Buy milk'), Todo('Call mom')]);"}\n    await vm.load();\n    ${s.case.includes('fails')?'expect(vm.state, isA<Failure>());':'expect(vm.state, isA<Data>());'}\n    verify(() => repo.todos()).called(1);   // it asked once\n  });\n}`:`class FakeRepo implements TodoRepository {\n  FakeRepo({this.items = const [], this.error});\n  final List<Todo> items;\n  final Exception? error;\n  @override\n  Future<List<Todo>> todos() async {\n    if (error != null) throw error!;\n    return items;\n  }\n}\n\nvoid main() {\n  test('${s.case}', () async {\n    final vm = TodosViewModel(${s.case.includes('fails')?'FakeRepo(error: const NetworkException())':s.case.includes('nothing')?'FakeRepo()':"FakeRepo(items: [Todo('Buy milk'), Todo('Call mom')])"});\n\n    await vm.load();\n\n    ${s.case.includes('fails')?'expect(vm.state, isA<Failure>());':"expect(vm.state, isA<Data>());\n    expect((vm.state as Data).items, hasLength("+(s.case.includes('nothing')?'0':'2')+'));'}\n  });\n}`;

def({cat:TQ,id:'error-logging',name:'Catch every error: Flutter, async and platform',tags:'error handling flutterror onerror platformdispatcher runzonedguarded crashlytics sentry crash reporting uncaught exception errorwidget builder zone async logging',h:430,
blurb:'Flutter has three places where errors escape. Errors inside the framework (build, layout, gestures) go to FlutterError.onError. Errors that happen outside Flutter code, such as an un-awaited Future that throws, go to PlatformDispatcher.instance.onError. If you set neither, they only print to the console, so you never see them from real users.',
use:'Every app that ships. Send errors to Firebase Crashlytics, Sentry or similar, so you find crashes before users complain.',
watch:'Set both handlers at the start of main. try/catch handles an error yourself, so remember to log it too. Replace the red error screen in release builds (ErrorWidget.builder). Upload symbols or source maps, or stack traces are unreadable. Do not send personal data. Check the current package docs for setup.',
ctl:[{k:'src',l:'what goes wrong',t:'sel',o:['exception in build()','exception in a button callback','un-awaited Future throws','caught with try/catch'],v:'un-awaited Future throws'},{k:'set',l:'handlers you set up',t:'sel',o:['nothing','FlutterError.onError only','both handlers'],v:'FlutterError.onError only'}],
render(s,st,g,d){
 const W={'exception in build()':['Flutter framework','FlutterError.onError','red screen (debug) or grey box (release)'],'exception in a button callback':['Flutter framework (gesture)','FlutterError.onError','the tap does nothing, the app keeps running'],'un-awaited Future throws':['the Dart zone, outside Flutter','PlatformDispatcher.instance.onError','the app may keep running in a broken state'],'caught with try/catch':['your own catch block','you decide','you must log it yourself']}[s.src];
 const reach=s.src==='caught with try/catch'?false:W[1]==='FlutterError.onError'?s.set!=='nothing':s.set==='both handlers';
 g.innerHTML=nbx(ncard('ERROR',esc(s.src),1)+narrow+ncard('CAUGHT BY',esc(W[0]),0)+narrow+ncard('REPORTED TO',esc(W[1]),0)+`<div style="border:1.5px solid ${reach?'var(--ok)':'var(--danger)'};color:${reach?'var(--ok)':'var(--danger)'};border-radius:8px;padding:8px 10px;font-size:12.5px"><b>${reach?'Reaches your crash service.':s.src==='caught with try/catch'?'Only logged if your catch block does it.':'Only printed to the console. You will not see it from users.'}</b><br>User sees: ${esc(W[2])}</div>`);
 const code=`Future<void> main() async {\n  WidgetsFlutterBinding.ensureInitialized();\n  await Firebase.initializeApp();\n\n  // 1. errors inside the Flutter framework\n  FlutterError.onError = (details) {\n    FlutterError.presentError(details);                 // still print in debug\n    FirebaseCrashlytics.instance.recordFlutterFatalError(details);\n  };\n\n  // 2. errors outside Flutter: un-awaited Futures, isolates, plugins\n  PlatformDispatcher.instance.onError = (error, stack) {\n    FirebaseCrashlytics.instance.recordError(error, stack, fatal: true);\n    return true;                                         // handled\n  };\n\n  // 3. friendlier screen than the red one in release\n  ErrorWidget.builder = (details) => kReleaseMode\n      ? const Center(child: Text('Something went wrong'))\n      : ErrorWidget(details.exception);\n\n  runApp(const MyApp());\n}\n\n// your own catch blocks must report too\ntry {\n  await repo.save(item);\n} catch (e, st) {\n  FirebaseCrashlytics.instance.recordError(e, st);       // non-fatal\n  showError();\n}\n\n// Sentry alternative:\n// await SentryFlutter.init((o) => o.dsn = '...', appRunner: () => runApp(const MyApp()));`;
 return {code,hint:'Choose the kind of failure and the handlers you set up. A red path means the error never reaches your crash service.'};
}});

def({cat:TQ,id:'logging-practices',name:'Logging: levels, release builds and privacy',tags:'logging logger debugprint print kdebugmode krelease level severe warning info redact pii privacy token password analytics package logging crash log breadcrumbs',h:420,
blurb:'Use log levels, so you can keep detail in debug builds and send only warnings and errors from release builds. Never log secrets or personal data, because logs can be read by other tools and ends up on servers.',
use:'Finding bugs during development, and giving yourself useful context when a crash report arrives from a user.',
watch:'print and debugPrint are only for quick checks. Use a logger package with levels. Never log passwords, tokens, full emails, card numbers or health data. Redact before logging. Keep release logging small, because it costs battery and data.',
ctl:[{k:'msg',l:'message',t:'sel',o:['debug trace','user tapped Buy','API returned 500','user email and token','caught exception with stack'],v:'user email and token'},{k:'mode',l:'build',t:'sel',o:['debug build','release build'],v:'release build'}],
render(s,st,g,d){
 const rel=s.mode==='release build';
 const M={'debug trace':['FINE',1,0,'ok'],'user tapped Buy':['INFO',1,0,'ok'],'API returned 500':['WARNING',1,1,'ok'],'user email and token':['INFO',0,0,'never'],'caught exception with stack':['SEVERE',1,1,'ok']}[s.msg];
 const [lvl,printable,remote,k]=M;
 const con=k==='never'?false:rel?(lvl==='SEVERE'||lvl==='WARNING'):true;
 const rem=k==='never'?false:rel&&remote;
 g.innerHTML=nbx(ncard('MESSAGE',esc(s.msg)+'  &middot; level '+lvl,1)+`<div style="display:flex;gap:8px">${[['Console',con],['Crash service',rem]].map(([n,v])=>`<div style="flex:1;border:1.5px solid ${v?'var(--ok)':'var(--line)'};color:${v?'var(--ok)':'var(--muted)'};border-radius:8px;padding:8px 10px;font:600 12.5px var(--f-mono)">${n}<br>${v?'yes':'no'}</div>`).join('')}</div>${k==='never'?badLine('Do not log this at all.\nRedact it first: log "user 8f3a" (an id), never the email or the token.'):`<div style="font-size:12.5px;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)">${rel?'Release builds keep WARNING and above only.':'Debug builds show everything, so you can see the detail.'}</div>`}`);
 const code=`// pubspec: logging (or logger)\nfinal log = Logger('Checkout');\n\nvoid setupLogging() {\n  Logger.root.level = kReleaseMode ? Level.WARNING : Level.ALL;\n  Logger.root.onRecord.listen((r) {\n    if (!kReleaseMode) debugPrint('\${r.level.name} \${r.loggerName}: \${r.message}');\n    if (r.level >= Level.WARNING) {\n      // add a breadcrumb or a non-fatal error to the crash service\n      FirebaseCrashlytics.instance.log('\${r.loggerName}: \${r.message}');\n      if (r.error != null) {\n        FirebaseCrashlytics.instance.recordError(r.error, r.stackTrace);\n      }\n    }\n  });\n}\n\n// use it\nlog.fine('cart has \${cart.length} items');          // debug only\nlog.info('user tapped Buy');\nlog.warning('API returned 500', error, stack);\nlog.severe('save failed', error, stack);\n\n// privacy: log ids, not personal data\nlog.info('signed in user \${user.id}');                // good\n// log.info('signed in $email $token');                // never`;
 return {code,hint:'Try the risky message in both builds. Some messages must never be logged, whatever the level.'};
}});

def({cat:LZ,id:'l10n-formats',name:'Dates, numbers, currency and right-to-left',tags:'intl dateformat numberformat currency locale format date time number decimal separator directionality rtl edgeinsetsdirectional alignmentdirectional textdirection arabic hebrew mirroring',h:430,
blurb:'The same date, number and price look different in each country. 1,234,567.89 in the US is 1.234.567,89 in Germany. The intl package formats them for a locale. Right-to-left languages also mirror the layout, so use start and end instead of left and right.',
use:'Showing dates, prices, quantities and distances to users in different regions.',

ctl:[{k:'loc',l:'locale',t:'sel',o:['en-US','id-ID','de-DE','ja-JP'],v:'en-US'},{k:'cur',l:'currency',t:'sel',o:['USD','IDR','EUR'],v:'USD'},{k:'rtl',l:'right-to-left layout',t:'chk',v:false}],
render(s,st,g,d){
 const dt=new Date(Date.UTC(2026,10,1,6,30)),loc=s.loc;
 let date='',num='',price='',time='';
 try{date=new Intl.DateTimeFormat(loc,{dateStyle:'long',timeZone:'UTC'}).format(dt);time=new Intl.DateTimeFormat(loc,{timeStyle:'short',timeZone:'UTC'}).format(dt);num=new Intl.NumberFormat(loc).format(1234567.89);price=new Intl.NumberFormat(loc,{style:'currency',currency:s.cur}).format(1234.5)}catch(e){date=num=price=time='(not supported here)'}
 const rows=[['date',date],['time',time],['number',num],['price',price]];
 g.innerHTML=nbx(rows.map(r=>`<div style="display:flex;justify-content:space-between;border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface)"><span style="font:600 11px var(--f-mono);color:var(--muted)">${r[0]}</span><span style="font:600 13px var(--f-mono)">${esc(r[1])}</span></div>`).join('')+`<div style="font:600 10.5px var(--f-mono);color:var(--muted)">A LIST ROW ${s.rtl?'(RIGHT-TO-LEFT)':'(LEFT-TO-RIGHT)'}</div><div dir="${s.rtl?'rtl':'ltr'}" style="display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface)"><div style="width:32px;height:32px;border-radius:50%;background:var(--c1)"></div><div style="flex:1;font-size:13px">Title text<br><span style="color:var(--muted);font-size:12px">subtitle</span></div><div style="font-size:18px">&#8250;</div></div><div style="font-size:12px;color:var(--muted)">${s.rtl?'Start is now on the right. The avatar, text and arrow all swap sides.':'Start is on the left.'}</div>`);
 const code=`// intl comes with flutter_localizations\nfinal now = DateTime(2026, 11, 1, 14, 30);\nfinal locale = '${loc.replace('-','_')}';\n\nDateFormat.yMMMMd(locale).format(now);          // ${date}\nDateFormat.jm(locale).format(now);              // ${time}\nNumberFormat.decimalPattern(locale).format(1234567.89);   // ${num}\nNumberFormat.simpleCurrency(locale: locale, name: '${s.cur}').format(1234.5);   // ${price}\n\n// use the app locale instead of a fixed one\nfinal l = Localizations.localeOf(context).toString();\n\n// if DateFormat says the locale data is missing:\n// await initializeDateFormatting('${loc.replace('-','_')}');\n\n// layouts that mirror in right-to-left\nPadding(\n  padding: const EdgeInsetsDirectional.only(start: 16, end: 8),   // not left / right\n  child: Align(\n    alignment: AlignmentDirectional.centerStart,\n    child: Text(title),\n  ),\n);\n\n// force a direction, or test it\nDirectionality(textDirection: TextDirection.${s.rtl?'rtl':'ltr'}, child: const MyRow());\n// icons that point (a back arrow) should mirror: Icon(Icons.arrow_back) does it itself,\n// custom images need matchTextDirection: true`;
 return {code,hint:'Change the locale and the currency. The right-to-left switch mirrors the row. Language and currency are independent choices.'};

def({cat:PP,id:'permissions-flow',name:'Runtime permissions: ask, explain, recover',tags:'permission permission_handler camera location notifications microphone denied permanentlydenied restricted limited openappsettings request status rationale manifest info.plist podfile privacy',h:430,
blurb:'Sensitive features (camera, location, notifications) need the user\'s permission. The status can be not asked, granted, denied, permanently denied, restricted or limited. Each one needs a different reaction from your app.',
use:'Any feature that uses the camera, microphone, location, contacts, photos or notifications.',
watch:'Ask at the moment the user needs the feature, not at app start, and explain why first. After a permanent denial you cannot show the system dialog again: send the user to Settings. Always have a path that works without the permission. Each platform needs declarations (AndroidManifest, Info.plist). Some plugins, such as image_picker, ask for you.',
ctl:[{k:'st',l:'status',t:'sel',o:['not asked yet','granted','denied (can ask again)','permanently denied','restricted (iOS)','limited (iOS photos)'],v:'not asked yet'}],
render(s,st,g,d){
 const M={'not asked yet':['Explain, then ask','"We use the camera to scan QR codes." [Continue] shows the system dialog.',0],'granted':['Use the feature','Open the camera.',1],'denied (can ask again)':['Explain again, offer to retry','"Without the camera you cannot scan. Try again?" Ask once more.',0],'permanently denied':['Send to Settings','"Camera access is off. Turn it on in Settings." [Open Settings]. The system dialog will not appear again.',0],'restricted (iOS)':['Explain, offer another way','Parental controls or a company policy block it. The user cannot change it in your app. Offer manual entry.',0],'limited (iOS photos)':['Work with what was shared','The user shared only some photos. Use them, and offer "Select more photos".',1]}[s.st];
 g.innerHTML=nbx(ncard('STATUS',esc(s.st),1)+narrow+ncard('YOUR APP SHOULD',`<b>${esc(M[0])}</b>`,0)+narrow+`<div style="border:1.5px solid ${M[2]?'var(--ok)':'var(--line)'};border-radius:12px;background:var(--surface);padding:12px;font-size:13px"><div style="font:600 10.5px var(--f-mono);color:var(--muted);margin-bottom:4px">WHAT THE USER SEES</div>${esc(M[1])}</div>`);
 const code=`// pubspec: permission_handler\nFuture<void> openScanner() async {\n  var status = await Permission.camera.status;\n\n  if (status.isDenied) {                  // not asked yet, or denied once\n    // show your own explanation first, then:\n    status = await Permission.camera.request();   // the system dialog\n  }\n\n  if (status.isGranted || status.isLimited) {\n    openCamera();\n  } else if (status.isPermanentlyDenied) {\n    // the system dialog will not show again\n    await openAppSettings();\n  } else if (status.isRestricted) {\n    showManualEntry();                    // the user cannot change this\n  } else {\n    showExplanation();                    // denied: offer to try again\n  }\n}\n\n// Android: android/app/src/main/AndroidManifest.xml\n// <uses-permission android:name="android.permission.CAMERA"/>\n\n// iOS: ios/Runner/Info.plist\n// <key>NSCameraUsageDescription</key>\n// <string>We use the camera to scan QR codes.</string>\n\n// iOS: Podfile (inside post_install) turns the permission on in the plugin\n// 'PERMISSION_CAMERA=1'   (see the permission_handler README)`;
 return {code,hint:'Choose each status in turn. The same code has to handle all of them, so test each one on a real phone.'};
}});

def({cat:PP,id:'app-lifecycle',name:'App lifecycle: resumed, inactive, hidden, paused',tags:'app lifecycle appLifecycleState widgetsbindingobserver didchangeapplifecyclestate resumed inactive paused detached hidden applifecyclelistener background foreground timer pause save',h:430,
blurb:'An app moves between states as the user switches away and back: resumed (in front), inactive, hidden, paused (in the background) and detached. You listen for these changes to pause work, save data, or refresh when the user returns.',
use:'Stopping a timer or camera in the background, saving a draft, and refreshing data when the app comes back.',
watch:'Remove the observer in dispose. Do not rely on detached to save data, because the system often kills the app without a callback. Save early and often. Platforms differ slightly in which states they report. Keep work in the callbacks short.',
ctl:[{k:'use',l:'example',t:'sel',o:['pause a timer','save a draft','refresh on return','stop the camera'],v:'save a draft'}],
render(s,st,g,d){
 if(!st.state){st.state='resumed';st.log=[]}
 const col={resumed:'var(--ok)',inactive:'var(--c3t)',hidden:'var(--c3t)',paused:'var(--muted)',detached:'var(--danger)'}[st.state];
 g.innerHTML=nbx(`<div style="display:flex;gap:6px;flex-wrap:wrap">${nbtn('home','Press Home')}${nbtn('call','Incoming call')}${nbtn('back','Return to app','Filled')}${nbtn('kill','System kills app')}${nbtn('clr','Clear log')}</div><div style="border:1.5px solid ${col};border-radius:10px;padding:10px 12px;background:var(--surface)"><div style="font:600 10.5px var(--f-mono);color:var(--muted)">CURRENT STATE</div><div style="font:700 20px var(--f-mono);color:${col}">${st.state}</div></div><div style="font:600 10.5px var(--f-mono);color:var(--muted)">didChangeAppLifecycleState LOG</div><div style="flex:1;overflow:auto;font:12px/1.6 var(--f-mono);border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface)">${st.log.length?st.log.slice(-7).map(x=>esc(x)).join('<br>'):'<span style="color:var(--muted)">Press a button.</span>'}</div>`);
 const body={'pause a timer':`case AppLifecycleState.paused:\n  _timer?.cancel();          // do not tick in the background\n  break;\ncase AppLifecycleState.resumed:\n  _startTimer();\n  break;`,'save a draft':`case AppLifecycleState.inactive:\ncase AppLifecycleState.paused:\n  _saveDraft();              // save early: the app may be killed next\n  break;`,'refresh on return':`case AppLifecycleState.resumed:\n  if (_lastLoad.isBefore(DateTime.now().subtract(const Duration(minutes: 5)))) {\n    _reload();               // data may be old\n  }\n  break;`,'stop the camera':`case AppLifecycleState.inactive:\n  _camera?.dispose();        // release the camera when not in front\n  break;\ncase AppLifecycleState.resumed:\n  _initCamera();\n  break;`}[s.use];
 const code=`class _PageState extends State<Page> with WidgetsBindingObserver {\n  @override\n  void initState() {\n    super.initState();\n    WidgetsBinding.instance.addObserver(this);\n  }\n\n  @override\n  void dispose() {\n    WidgetsBinding.instance.removeObserver(this);\n    super.dispose();\n  }\n\n  @override\n  void didChangeAppLifecycleState(AppLifecycleState state) {\n    switch (state) {\n${body.replace(/^/gm,'      ')}\n      default:\n        break;\n    }\n  }\n}\n\n// newer alternative with one callback per state (Flutter 3.13+)\nlate final _listener = AppLifecycleListener(\n  onPause: _saveDraft,\n  onResume: _reload,\n);\n// _listener.dispose() in dispose()`;
 return {code,hint:'Press the buttons in different orders and read the log. Going to the background passes through inactive and hidden before paused.'};
},
act(a,st){
 const log=(x)=>st.log.push(x);
 const to=(arr)=>arr.forEach(x=>{st.state=x;log('AppLifecycleState.'+x)});
 if(a==='clr'){st.log=[];return}
 const S=st.state;
 if(a==='home'){if(S==='resumed')to(['inactive','hidden','paused']);else if(S==='inactive')to(['hidden','paused']);else if(S==='hidden')to(['paused'])}
 else if(a==='call'){if(S==='resumed')to(['inactive'])}
 else if(a==='back'){if(S==='paused')to(['hidden','inactive','resumed']);else if(S==='hidden')to(['inactive','resumed']);else if(S==='inactive')to(['resumed']);else if(S==='detached'){st.state='resumed';log('(app was started again)')}}
 else if(a==='kill'){if(S==='paused'){to(['detached']);log('(often no callback arrives when the system kills the app)')}else if(S==='resumed')log('(it must go to the background first)')}
}});

const rwBox=(w,inner)=>`<div style="position:absolute;inset:10px 14px;display:flex;flex-direction:column;gap:6px"><div style="font:600 11px var(--f-mono);color:var(--muted)">WIDTH ${w} dp</div><div style="flex:1;display:flex;justify-content:center"><div style="width:${Math.round(34+(Math.min(w,1400)-320)/1080*66)}%;min-width:120px;border:2px solid var(--line);border-radius:10px;background:var(--surface);padding:6px;display:flex;flex-direction:column;gap:5px;overflow:hidden">${inner}</div></div></div>`;

def({cat:RA,id:'responsive-breakpoints',name:'Responsive layout: breakpoints and window size classes',tags:'responsive adaptive breakpoint window size class compact medium expanded layoutbuilder mediaquery sizeof tablet desktop web foldable two pane master detail wrap gridview maxcrossaxisextent constraints',h:430,
blurb:'A responsive layout changes with the space it has. Material 3 groups widths into window size classes: compact (under 600 dp), medium (600 to 839), expanded (840 and above). On a phone you show one column, on a tablet a grid, and on a wide screen a list with a detail pane.',

watch:'Decide by the space your widget gets (LayoutBuilder), not by the device type. Use MediaQuery.sizeOf(context) to read the window size without rebuilding for unrelated changes. Do not lock the orientation without a reason. Limit the width of text lines on wide screens. Test a resizable window.',
ctl:[{k:'w',l:'window width (dp)',t:'rng',min:320,max:1400,step:20,v:400},{k:'how',l:'read the size with',t:'sel',o:['LayoutBuilder','MediaQuery.sizeOf'],v:'LayoutBuilder'}],
render(s,st,g,d){
 const w=s.w;const cls=w<600?'compact':w<840?'medium':'expanded';
 const item=(i)=>blk(26,'Item '+i);
 const inner=cls==='compact'?[1,2,3,4].map(item).join(''):cls==='medium'?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:5px">${[1,2,3,4,5,6].map(item).join('')}</div>`:`<div style="display:flex;gap:6px"><div style="flex:0 0 38%;display:flex;flex-direction:column;gap:5px">${[1,2,3,4].map(item).join('')}</div><div style="flex:1">${blk(120,'Detail pane','var(--c3s)')}</div></div>`;
 g.innerHTML=rwBox(w,`<div style="font:700 11px var(--f-mono)">${cls.toUpperCase()}</div>`+inner);
 const code=`// Material 3 window size classes\nenum WindowClass { compact, medium, expanded }\nWindowClass windowClassOf(double width) =>\n    width < 600 ? WindowClass.compact\n    : width < 840 ? WindowClass.medium\n    : WindowClass.expanded;\n\n${s.how==='LayoutBuilder'?`// the space THIS widget gets (best for reusable widgets)\nLayoutBuilder(\n  builder: (context, box) {\n    switch (windowClassOf(box.maxWidth)) {\n      case WindowClass.compact:\n        return const ItemList();                         // one column\n      case WindowClass.medium:\n        return const ItemGrid(columns: 2);\n      case WindowClass.expanded:\n        return const Row(children: [\n          SizedBox(width: 320, child: ItemList()),\n          Expanded(child: DetailPane()),\n        ]);\n    }\n  },\n);`:`// the size of the whole window\nfinal width = MediaQuery.sizeOf(context).width;   // rebuilds only when the size changes\nif (width >= 840) return const TwoPaneLayout();\nif (width >= 600) return const ItemGrid(columns: 2);\nreturn const ItemList();`}\n\n// a grid that picks the number of columns itself\nGridView.builder(\n  gridDelegate: const SliverGridDelegateWithMaxCrossAxisExtent(maxCrossAxisExtent: 220),\n  itemBuilder: (_, i) => ItemCard(items[i]),\n);\n\n// keep long text readable on wide screens\nCenter(child: ConstrainedBox(constraints: const BoxConstraints(maxWidth: 720), child: content));`;
 return {code,hint:'Drag the width. At 600 and 840 the layout changes class. The framed box shows what is built at that width.'};

def({cat:RA,id:'adaptive-navigation',name:'Adaptive navigation: bar, rail and drawer',tags:'adaptive navigation navigationbar navigationrail navigationdrawer bottom bar rail drawer width breakpoint destinations scaffold tablet desktop material 3 extended',h:430,
blurb:'Navigation should fit the space. On a narrow phone a bottom NavigationBar is easy to reach. On a medium screen a NavigationRail sits on the side. On a wide screen a permanent NavigationDrawer can show labels. All three use the same list of destinations.',
use:'Apps with a few main sections that run on phones and larger screens.',
watch:'Keep one list of destinations and build all three widgets from it, so they never disagree. A rail needs a Row with Expanded content next to it. Keep the selected index in one place. Material has an adaptive scaffold package (flutter_adaptive_scaffold) that does this switching for you, check that it is still maintained before you use it.',

 const inner=kind==='bar'?`<div style="flex:1">${body}</div>${nav}`:`<div style="display:flex;gap:6px">${nav}<div style="flex:1">${body}</div></div>`;
 g.innerHTML=rwBox(w,`<div style="font:700 11px var(--f-mono)">${kind==='bar'?'NavigationBar (bottom)':kind==='rail'?'NavigationRail (side)':'NavigationDrawer (permanent)'}</div>`+inner);
 const code=`const destinations = [\n  (icon: Icons.home, label: 'Home'),\n  (icon: Icons.search, label: 'Search'),\n  (icon: Icons.person, label: 'Profile'),\n];\n\nclass AdaptiveScaffold extends StatelessWidget {\n  const AdaptiveScaffold({super.key, required this.index, required this.onSelect, required this.body});\n  final int index;\n  final ValueChanged<int> onSelect;\n  final Widget body;\n\n  @override\n  Widget build(BuildContext context) {\n    final width = MediaQuery.sizeOf(context).width;\n\n    if (width < 600) {            // ${kind==='bar'?'<-- now':'compact'}\n      return Scaffold(\n        body: body,\n        bottomNavigationBar: NavigationBar(\n          selectedIndex: index,\n          onDestinationSelected: onSelect,\n          destinations: [for (final d in destinations)\n            NavigationDestination(icon: Icon(d.icon), label: d.label)],\n        ),\n      );\n    }\n    return Scaffold(              // ${kind==='bar'?'medium and expanded':kind==='rail'?'<-- now (medium)':'<-- now (wide)'}\n      body: Row(children: [\n        NavigationRail(\n          extended: width >= 1200,   // show labels next to icons on wide screens\n          selectedIndex: index,\n          onDestinationSelected: onSelect,\n          destinations: [for (final d in destinations)\n            NavigationRailDestination(icon: Icon(d.icon), label: Text(d.label))],\n        ),\n        const VerticalDivider(width: 1),\n        Expanded(child: body),\n      ]),\n    );\n  }\n}`;
 return {code,hint:'Drag the width across 600 and 1200. The destinations stay the same, only the widget that shows them changes.'};

def({cat:RA,id:'text-scale-safe',name:'Text size, safe areas and orientation',tags:'text scale textscaler textscalefactor accessibility large font overflow flexible wrap safearea notch cutout orientation orientationbuilder minheight fixed height viewpadding viewinsets keyboard',h:430,

ctl:[{k:'sc',l:'text scale',t:'rng',min:0.8,max:2,step:0.2,v:1},{k:'fix',l:'container',t:'sel',o:['fixed height 44','flexible (minHeight 44)'],v:'fixed height 44'}],
render(s,st,g,d){
 const sc=s.sc,fixed=s.fix.startsWith('fixed');
 const txt='Free delivery on orders over $50';
 const cpl=Math.max(4,Math.floor(210/(7*sc))),lines=Math.ceil(txt.length/cpl),need=lines*20*sc;
 const over=fixed&&need>44;
 g.innerHTML=nbx(`<div style="font:600 11px var(--f-mono);color:var(--muted)">TEXT SCALE ${Math.round(sc*100)}%</div><div style="width:240px;max-width:100%;border:1.5px solid ${over?'var(--danger)':'var(--line)'};border-radius:10px;background:var(--surface);padding:6px 12px;${fixed?'height:44px;overflow:hidden':'min-height:44px'};font-size:${14*sc}px;line-height:1.3">${esc(txt)}</div>${over?badLine('A RenderFlex overflowed by '+Math.round(need-44)+' pixels on the bottom.\nThe text is cut off.'):okLine('The text fits'+(fixed?'':', and the box grew to '+Math.round(Math.max(44,need))+' px')+'.')}<div style="font-size:12px;color:var(--muted);margin-top:auto">The 44 pixel container is fine at 100%, but users with large text will see it clipped.</div>`);
 const code=`// the bug: a fixed height around text\nContainer(\n  height: 44,\n  child: Text('Free delivery on orders over \\$50'),\n);\n\n// the fix: let it grow\nContainer(\n  constraints: const BoxConstraints(minHeight: 44),\n  padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 6),\n  child: const Text('Free delivery on orders over \\$50'),\n);\n\n// text inside a Row must be allowed to wrap\nRow(children: [\n  const Icon(Icons.local_shipping),\n  const SizedBox(width: 8),\n  Expanded(child: Text(message)),     // Expanded or Flexible, not bare Text\n]);\n\n// read or limit the scale (do not disable it)\nfinal scaler = MediaQuery.textScalerOf(context);\nMediaQuery(\n  data: MediaQuery.of(context).copyWith(\n    textScaler: scaler.clamp(maxScaleFactor: 1.6),   // a limit, not zero\n  ),\n  child: child,\n);\n\n// notch, cutouts and the home bar\nScaffold(body: SafeArea(child: content));\n\n// landscape\nOrientationBuilder(builder: (context, o) =>\n    o == Orientation.landscape ? const WideLayout() : const TallLayout());`;
 return {code,hint:'Raise the text scale with a fixed height container to see the overflow. Switch to flexible and the box grows.'};
}});
