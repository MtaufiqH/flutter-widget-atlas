mapPage({id:'android-concepts',name:'Android concepts in Flutter (Activity, Intent, Service)',label:'Android concept',left:'ANDROID (KOTLIN)',
tags:'android kotlin activity fragment intent service workmanager broadcastreceiver application sharedpreferences viewmodel livedata manifest rotation looper coming from android native equivalent',
blurb:'Flutter has no Activity or Fragment for each screen. One native Activity hosts the whole app, and screens are widgets. This page maps the Android ideas you know to the Flutter way of doing the same job.',
use:'You already know Android and want the Flutter name for a concept, so you can find the right page in this atlas.',
watch:'Flutter is not a wrapper around Android views, so the mapping is by purpose, not one to one. For anything Android only (a special Service, a broadcast), a plugin or a platform channel is the answer. The packages named here change over time, so check pub.dev.',
items:[
['Activity','class MainActivity : AppCompatActivity() {\n  override fun onCreate(s: Bundle?) {\n    super.onCreate(s)\n    setContentView(R.layout.main)\n  }\n}','A screen is a widget (a route)','class HomeScreen extends StatefulWidget {\n  const HomeScreen({super.key});\n  @override\n  State<HomeScreen> createState() => _HomeScreenState();\n}\nclass _HomeScreenState extends State<HomeScreen> {\n  @override\n  void initState() { super.initState(); }   // like onCreate\n  @override\n  void dispose() { super.dispose(); }      // like onDestroy\n  @override\n  Widget build(BuildContext context) => const Scaffold();\n}','Your app has one native Activity (FlutterActivity). Every screen lives inside it as a route, so you never write an Activity per screen. See the Navigator and go_router pages.'],
['Fragment','supportFragmentManager.beginTransaction()\n  .replace(R.id.container, ProfileFragment())\n  .commit()','A reusable widget','// any widget can be reused anywhere\nclass ProfilePanel extends StatelessWidget {\n  const ProfilePanel({super.key});\n  @override\n  Widget build(BuildContext context) => const Text(\'Profile\');\n}\n\nbody: isWide ? const Row(children: [Expanded(child: ListPane()), Expanded(child: ProfilePanel())]) : const ListPane(),','Flutter does not need Fragments. Parts of a screen are widgets, and a two-pane layout is a Row. For tabs with their own back stack, see the bottom tabs page.'],
['Intent: open a screen','startActivity(\n  Intent(this, DetailActivity::class.java)\n    .putExtra("id", 7)\n)','Navigator.push (or context.go)','Navigator.push(\n  context,\n  MaterialPageRoute(builder: (_) => DetailScreen(id: 7)),\n);\n\n// or with go_router\ncontext.go(\'/detail/7\');','Data goes in the constructor, as a typed object, so there is no Bundle and no Parcelable. See "Navigator: push, pop and results".'],
['Intent: open a link or share','startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(url)))\n\nIntent(Intent.ACTION_SEND).apply {\n  type = "text/plain"; putExtra(Intent.EXTRA_TEXT, "Hi")\n}','url_launcher and share_plus','// pubspec: url_launcher, share_plus\nawait launchUrl(Uri.parse(\'https://flutter.dev\'));\nawait Share.share(\'Check this out\');','Use plugins for anything that needs the operating system. Open links from your own app with launchUrl, and incoming links with deep links.'],
['Service / WorkManager','class SyncWorker(ctx: Context, p: WorkerParameters) : CoroutineWorker(ctx, p) {\n  override suspend fun doWork(): Result { sync(); return Result.success() }\n}\nWorkManager.getInstance(ctx).enqueue(request)','workmanager package, or an isolate','// pubspec: workmanager\nWorkmanager().initialize(callbackDispatcher);\nWorkmanager().registerPeriodicTask(\'sync\', \'syncTask\',\n    frequency: const Duration(hours: 1));\n\n@pragma(\'vm:entry-point\')\nvoid callbackDispatcher() {\n  Workmanager().executeTask((task, input) async {\n    await sync();\n    return true;\n  });\n}\n\n// heavy work while the app is open\nfinal result = await compute(parseBig, text);','Background work when the app is closed is limited by the operating system on both platforms. For work while the app is open, use an isolate (compute or Isolate.run).'],
['BroadcastReceiver','registerReceiver(object : BroadcastReceiver() {\n  override fun onReceive(c: Context, i: Intent) { /* connectivity changed */ }\n}, IntentFilter(ConnectivityManager.CONNECTIVITY_ACTION))','A Stream from a plugin','// pubspec: connectivity_plus\nfinal sub = Connectivity().onConnectivityChanged.listen((result) {\n  // update state\n});\n// cancel it in dispose()\nsub.cancel();','Plugins turn system events into Streams. For your own native events, use an EventChannel.'],
['Application class','class App : Application() {\n  override fun onCreate() {\n    super.onCreate()\n    startKoin { ... }\n  }\n}','main() before runApp','Future<void> main() async {\n  WidgetsFlutterBinding.ensureInitialized();\n  await Firebase.initializeApp();\n  setupLocator();                 // dependency injection\n  runApp(const MyApp());\n}','main() is your Application.onCreate. Do the setup there, and keep it short so the first frame appears quickly.'],
['SharedPreferences','val p = getSharedPreferences("app", MODE_PRIVATE)\np.edit().putBoolean("dark", true).apply()\nval dark = p.getBoolean("dark", false)','shared_preferences package','final prefs = await SharedPreferences.getInstance();\nawait prefs.setBool(\'dark\', true);\nfinal dark = prefs.getBool(\'dark\') ?? false;','Same idea and same limits: small values only, and not for secrets. Use flutter_secure_storage for tokens. See "Local storage: which one to use".'],
['ViewModel + LiveData / StateFlow','class TodoVm : ViewModel() {\n  private val _state = MutableStateFlow<UiState>(Loading)\n  val state: StateFlow<UiState> = _state\n}','ChangeNotifier or ValueNotifier + a builder','class TodoVm extends ChangeNotifier {\n  UiState state = const Loading();\n  Future<void> load() async {\n    state = Data(await repo.todos());\n    notifyListeners();\n  }\n}\n\nListenableBuilder(\n  listenable: vm,\n  builder: (_, __) => switch (vm.state) { /* ... */ },\n)','The names change, the idea stays: a class that holds screen state, and the UI rebuilds when it changes. Riverpod and Bloc are the larger options. See the state pages.'],
['Manifest permissions','<uses-permission android:name="android.permission.CAMERA"/>\n\nrequestPermissions(arrayOf(CAMERA), 1)','AndroidManifest still, plus permission_handler','// android/app/src/main/AndroidManifest.xml keeps the line above\nfinal status = await Permission.camera.request();\nif (status.isPermanentlyDenied) await openAppSettings();','The manifest is still in your project (android/ folder) and you still edit it. Runtime asking is done from Dart. See "Runtime permissions".'],
['Rotation and onSaveInstanceState','override fun onSaveInstanceState(out: Bundle) {\n  out.putInt("count", count)\n}','State survives rotation. RestorationMixin for process death','// rotation does not recreate your State object\n// to survive the system killing the app:\nclass _S extends State<W> with RestorationMixin {\n  final _count = RestorableInt(0);\n  @override\n  String? get restorationId => \'counter\';\n  @override\n  void restoreState(RestorationBucket? old, bool initial) {\n    registerForRestoration(_count, \'count\');\n  }\n  ...\n}','Rotation is much easier in Flutter because the Activity is not recreated. Most apps skip restoration and reload data instead.'],
['Main thread and Handler','Thread { heavyWork() }.start()\nrunOnUiThread { text.text = "done" }\n// or: withContext(Dispatchers.Default) { ... }','One UI isolate. Use compute for heavy work','// do not block the UI isolate with big loops or huge JSON\nfinal list = await compute(parseUsers, jsonString);\n\n// newer API\nfinal result = await Isolate.run(() => heavyWork(input));','Dart is single-threaded per isolate. await does not block the UI. Only long synchronous code does. Isolates do not share memory, so you pass messages.']
]});

mapPage({id:'android-ui',name:'Android UI in Flutter (Views and Compose to widgets)',label:'Android UI element',left:'ANDROID (JETPACK COMPOSE)',
tags:'android compose xml textview button edittext imageview recyclerview linearlayout constraintlayout toolbar alertdialog toast viewpager cardview swiperefresh bottomnavigation themes strings remember compose equivalent widgets',
blurb:'Flutter draws every widget itself and builds the screen as a tree of widgets, much like Jetpack Compose. If you know Compose, this will feel close. If you know XML Views, each View has a widget with a similar name.',
use:'You know the Android element and want the widget that does the same job.',
watch:'Padding, margin and size are not properties of every widget. They are separate widgets (Padding, SizedBox, Container). Lists need a bounded height, or you get an error. Flutter has no sp unit: text follows the user\'s font size by itself.',
items:[
['TextView / Text','Text(\n  "Hello",\n  fontSize = 18.sp,\n  fontWeight = FontWeight.Bold,\n)','Text','const Text(\n  \'Hello\',\n  style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold),\n);','The Text widget. Styles can come from Theme.of(context).textTheme so the whole app stays consistent.'],
['Button','Button(onClick = { save() }) { Text("Save") }','FilledButton / ElevatedButton','FilledButton(\n  onPressed: save,\n  child: const Text(\'Save\'),\n);\n// onPressed: null disables it','Material 3 has FilledButton, ElevatedButton, OutlinedButton and TextButton. See the Buttons page.'],
['EditText / TextField','var text by remember { mutableStateOf("") }\nTextField(value = text, onValueChange = { text = it })','TextField with a controller','final _c = TextEditingController();\n\nTextField(\n  controller: _c,\n  decoration: const InputDecoration(labelText: \'Name\'),\n  onChanged: (v) {},\n);\n// _c.dispose() in State.dispose','Dispose controllers. For forms with validation use TextFormField inside a Form.'],
['ImageView / Image','Image(painter = painterResource(R.drawable.logo), contentDescription = "Logo")\nAsyncImage(model = url, contentDescription = null)','Image.asset and Image.network','Image.asset(\'assets/logo.png\', width: 80);\nImage.network(url, fit: BoxFit.cover);\n// declare assets in pubspec.yaml','Assets must be listed in pubspec.yaml. For a disk cache, use cached_network_image.'],
['RecyclerView / LazyColumn','LazyColumn {\n  items(todos) { TodoRow(it) }\n}','ListView.builder','ListView.builder(\n  itemCount: todos.length,\n  itemBuilder: (context, i) => TodoRow(todos[i]),\n);','It also builds only the visible rows, so no adapter or ViewHolder is needed. See "Long lists: ListView.builder".'],
['LinearLayout / Column and Row','Column {\n  Text("A")\n  Row { Text("B"); Text("C") }\n}','Column and Row','Column(\n  crossAxisAlignment: CrossAxisAlignment.start,\n  children: [\n    const Text(\'A\'),\n    const Row(children: [Text(\'B\'), Text(\'C\')]),\n  ],\n);','The same model as a LinearLayout. Use Expanded and Flexible inside them in place of weight.'],
['FrameLayout / Box','Box {\n  Image(...)\n  Text("Overlay", Modifier.align(Alignment.BottomStart))\n}','Stack','Stack(\n  children: [\n    Image.asset(\'assets/photo.jpg\'),\n    const Align(\n      alignment: Alignment.bottomLeft,\n      child: Text(\'Overlay\'),\n    ),\n  ],\n);','Children are drawn on top of each other. Use Align or Positioned to place them.'],
['ConstraintLayout','ConstraintLayout {\n  val (a, b) = createRefs()\n  Text("A", Modifier.constrainAs(a) { top.linkTo(parent.top) })\n}','Stack, Align, Row and Column, or Flex','// most layouts need only Row, Column, Expanded and Padding\n// precise placement over another widget:\nStack(children: [\n  Positioned(top: 8, right: 8, child: icon),\n  content,\n]);','Flutter has no constraint solver. Nesting simple widgets is normal and fast. See the Layout category.'],
['ScrollView / verticalScroll','Column(Modifier.verticalScroll(rememberScrollState())) { ... }','SingleChildScrollView','const SingleChildScrollView(\n  child: Column(children: [ /* many widgets */ ]),\n);','Use it for short content. For long or dynamic content use ListView.builder.'],
['Toolbar / TopAppBar','Scaffold(\n  topBar = { TopAppBar(title = { Text("Home") }) }\n) { padding -> ... }','Scaffold with AppBar','Scaffold(\n  appBar: AppBar(title: const Text(\'Home\')),\n  body: const Placeholder(),\n  floatingActionButton: FloatingActionButton(onPressed: add, child: const Icon(Icons.add)),\n);','Scaffold is nearly the same in both. The body is already placed below the app bar.'],
['AlertDialog','AlertDialog(\n  onDismissRequest = {},\n  title = { Text("Delete?") },\n  confirmButton = { TextButton(onClick = {}) { Text("OK") } }\n)','showDialog + AlertDialog','final ok = await showDialog<bool>(\n  context: context,\n  builder: (_) => AlertDialog(\n    title: const Text(\'Delete?\'),\n    actions: [\n      TextButton(onPressed: () => Navigator.pop(context, true), child: const Text(\'OK\')),\n    ],\n  ),\n);','A dialog is a route, so it is closed with Navigator.pop and can return a value.'],
['Toast / Snackbar','Toast.makeText(ctx, "Saved", Toast.LENGTH_SHORT).show()\nsnackbarHostState.showSnackbar("Saved")','ScaffoldMessenger SnackBar','ScaffoldMessenger.of(context).showSnackBar(\n  const SnackBar(content: Text(\'Saved\')),\n);','There is no plain Toast in Flutter. A SnackBar is the standard choice.'],
['ViewPager2 / HorizontalPager','HorizontalPager(state = rememberPagerState { 3 }) { page -> PageContent(page) }','PageView','PageView(\n  controller: PageController(),\n  children: const [PageA(), PageB(), PageC()],\n);','Pair it with a TabBar and TabBarView for tabs.'],
['CardView / Card','Card(elevation = CardDefaults.cardElevation(4.dp)) { ... }','Card','Card(\n  elevation: 4,\n  child: const Padding(padding: EdgeInsets.all(16), child: Text(\'Hi\')),\n);','Card has no padding of its own, so add a Padding inside.'],
['SwipeRefreshLayout','PullToRefreshBox(isRefreshing = loading, onRefresh = { reload() }) { ... }','RefreshIndicator','RefreshIndicator(\n  onRefresh: () async => await reload(),\n  child: ListView(children: items),\n);','The child must be scrollable.'],
['BottomNavigationView','NavigationBar {\n  NavigationBarItem(selected = true, onClick = {}, icon = {}, label = {})\n}','NavigationBar','NavigationBar(\n  selectedIndex: index,\n  onDestinationSelected: (i) => setState(() => index = i),\n  destinations: const [\n    NavigationDestination(icon: Icon(Icons.home), label: \'Home\'),\n  ],\n);','See the bottom tabs and adaptive navigation pages.'],
['padding, margin, size (dp)','Modifier.padding(16.dp).size(48.dp)','Padding, SizedBox, Container','const Padding(padding: EdgeInsets.all(16), child: Text(\'Hi\'));\nconst SizedBox(width: 48, height: 48);\nContainer(margin: const EdgeInsets.all(8), color: Colors.blue);','Units are logical pixels (like dp). There is no margin on most widgets: wrap them in Padding.'],
['themes.xml and colors','<style name="AppTheme" parent="Theme.Material3.DayNight">\n  <item name="colorPrimary">@color/teal</item>\n</style>','ThemeData and ColorScheme','MaterialApp(\n  theme: ThemeData(\n    colorScheme: ColorScheme.fromSeed(seedColor: Colors.teal),\n    useMaterial3: true,\n  ),\n);','One ThemeData at the top. See the Theming and resources category.'],
['strings.xml','<string name="hello">Hello %1$s</string>\ngetString(R.string.hello, name)','ARB files and AppLocalizations','// lib/l10n/app_en.arb: "hello": "Hello {name}"\nText(AppLocalizations.of(context)!.hello(name));','See "Localization: ARB files, placeholders and plurals".'],
['remember { mutableStateOf }','var count by remember { mutableStateOf(0) }\nButton(onClick = { count++ }) { Text("$count") }','StatefulWidget and setState','class _CounterState extends State<Counter> {\n  int count = 0;\n  @override\n  Widget build(BuildContext context) => FilledButton(\n    onPressed: () => setState(() => count++),\n    child: Text(\'$count\'),\n  );\n}','setState marks the widget as dirty, so build runs again. This is the same idea as Compose recomposition.']
]});

mapPage({id:'android-libs',name:'Android libraries and their Flutter packages',label:'Android library',left:'ANDROID (KOTLIN)',
tags:'android libraries retrofit okhttp gson moshi room hilt dagger koin coil glide timber navigation datastore workmanager parcelize coroutines flow paging exoplayer mockito junit espresso packages pubdev equivalent',
blurb:'Almost every Android library has a Flutter package that does the same job. This page lists the common ones, so you can pick a package without searching for hours.',
use:'Choosing a package when you already know which Android library you would use.',
watch:'Packages come and go, so check the last release date, the number of likes and the open issues on pub.dev before you choose. Prefer packages from the Flutter team (flutter.dev) or well-known publishers. The names here are from my own knowledge.',
items:[
['Retrofit','interface Api {\n  @GET("users/{id}")\n  suspend fun user(@Path("id") id: Int): User\n}','dio (plus retrofit.dart if you want annotations)','final res = await dio.get<Map<String, dynamic>>(\'/users/$id\');\nfinal user = User.fromJson(res.data!);','See "Calling an API (http & Dio)" and "Dio + freezed: a full data layer".'],
['OkHttp interceptor','class AuthInterceptor : Interceptor {\n  override fun intercept(chain: Interceptor.Chain): Response { ... }\n}','Dio interceptors','dio.interceptors.add(InterceptorsWrapper(\n  onRequest: (o, h) { o.headers[\'Authorization\'] = \'Bearer $token\'; h.next(o); },\n));','See "Tokens: store, refresh and log out".'],
['Gson / Moshi / kotlinx.serialization','@Serializable data class User(val id: Int, val name: String)\nGson().fromJson(json, User::class.java)','json_serializable + freezed','@freezed\nabstract class User with _$User {\n  const factory User({required int id, required String name}) = _User;\n  factory User.fromJson(Map<String, dynamic> j) => _$UserFromJson(j);\n}','Dart has no reflection, so code is generated at build time with build_runner. See "JSON models & serialization".'],
['Room','@Entity data class Todo(@PrimaryKey val id: Int, val title: String)\n@Dao interface TodoDao { @Query("SELECT * FROM todo") fun all(): Flow<List<Todo>> }','drift (or sqflite)','// drift\nclass Todos extends Table {\n  IntColumn get id => integer().autoIncrement()();\n  TextColumn get title => text()();\n}\nfinal rows = await select(todos).get();','drift is the closest to Room. See "SQLite CRUD (sqflite & drift)".'],
['Hilt / Dagger / Koin','@HiltViewModel class TodoVm @Inject constructor(private val repo: TodoRepo) : ViewModel()','Provider, Riverpod or get_it','getIt.registerLazySingleton<TodoRepo>(() => TodoRepoImpl(dio));\nfinal vm = TodoVm(getIt<TodoRepo>());','Start with constructor parameters. See "Dependency injection and fakes".'],
['Coil / Glide','AsyncImage(model = url, contentDescription = null)','Image.network or cached_network_image','CachedNetworkImage(\n  imageUrl: url,\n  memCacheWidth: 300,\n  placeholder: (_, __) => const ColoredBox(color: Colors.black12),\n);','See "Image size and caching".'],
['Timber','Timber.d("loaded %d items", n)\nTimber.e(error, "failed")','logging or logger package','final log = Logger(\'Todos\');\nlog.info(\'loaded $n items\');\nlog.severe(\'failed\', error, stack);','See "Logging: levels, release builds and privacy".'],
['Navigation Component','findNavController().navigate(R.id.action_home_to_detail)','go_router','context.go(\'/detail/7\');','See the Navigation and routing category.'],
['DataStore / SharedPreferences','dataStore.edit { it[DARK] = true }','shared_preferences','await (await SharedPreferences.getInstance()).setBool(\'dark\', true);','For secrets, use flutter_secure_storage.'],
['WorkManager','WorkManager.getInstance(ctx).enqueue(OneTimeWorkRequestBuilder<SyncWorker>().build())','workmanager','await Workmanager().registerOneOffTask(\'sync\', \'syncTask\');','Background rules are set by Android and iOS, and they differ.'],
['Parcelize / Parcelable','@Parcelize data class User(val id: Int) : Parcelable\nintent.putExtra("user", user)','Nothing: pass the object','Navigator.push(\n  context,\n  MaterialPageRoute(builder: (_) => UserScreen(user: user)),\n);','You pass real Dart objects to the next screen. You only need JSON to save or send data. See "Navigator: push, pop and results".'],
['Coroutines and Flow','viewModelScope.launch {\n  val items = repo.todos()\n  _state.value = Data(items)\n}\nrepo.updates.collect { }','async / await and Stream','final items = await repo.todos();\nawait for (final u in repo.updates) { /* each event */ }\nfinal sub = repo.updates.listen((u) {});','See "Async" pages and the Dart async page.'],
['Paging 3','Pager(PagingConfig(pageSize = 20)) { TodoPagingSource() }.flow','infinite_scroll_pagination, or ListView.builder with load-more','// when the last item scrolls into view, load the next page\nitemBuilder: (context, i) {\n  if (i == items.length - 3) loadMore();\n  return Tile(items[i]);\n}','Plain ListView.builder with a "load more" call is enough for many apps.'],
['ExoPlayer / Media3','val player = ExoPlayer.Builder(ctx).build()\nplayer.setMediaItem(MediaItem.fromUri(url))','video_player (and chewie for controls)','final c = VideoPlayerController.networkUrl(Uri.parse(url));\nawait c.initialize();\nVideoPlayer(c);','Remember to dispose the controller.'],
['Mockito / MockK','val repo = mockk<TodoRepo>()\nevery { repo.todos() } returns listOf(todo)','mocktail','final repo = MockRepo();\nwhen(() => repo.todos()).thenAnswer((_) async => [todo]);','See "Unit tests: a ViewModel with a fake repository".'],
['JUnit / Espresso','@Test fun adds() { ... }\nonView(withId(R.id.add)).perform(click())','flutter_test and integration_test','test(\'adds\', () { });\ntestWidgets(\'taps\', (tester) async { await tester.tap(find.byKey(const Key(\'add\'))); });','See the Testing and quality category.'],
['Firebase (Android SDK)','Firebase.auth.signInWithEmailAndPassword(email, pw).await()','FlutterFire (firebase_core, firebase_auth, ...)','await FirebaseAuth.instance.signInWithEmailAndPassword(email: email, password: pw);','See the Firebase category.']
]});

mapPage({id:'kotlin-to-dart',name:'Kotlin to Dart: the language side by side',label:'Kotlin feature',left:'KOTLIN',h:400,
tags:'kotlin dart language syntax data class sealed class extension function null safety lateinit lazy when elvis safe call object singleton string template named arguments default arguments lambda higher order comparison',
blurb:'Kotlin and Dart look alike on purpose, so you can read Dart after a day. This page shows the small differences that cause most mistakes.',
use:'Writing Dart for the first time when you already write Kotlin.',
watch:'Dart has no data classes (use freezed or records), no top-level coroutines (use async), and no checked exceptions. A Dart class is not final by default, and all classes are open for extension unless marked. String templates use $name or ${expression}, which is the same as Kotlin. Check the Dart language tour for details.',
items:[
['val / var / const','val name = "Taufiq"\nvar count = 0\nconst val MAX = 10','final / var / const','final name = \'Taufiq\';   // set once, like val\nvar count = 0;           // can change\nconst max = 10;           // compile-time constant','final is the nearest to val. const means known at compile time, and const widgets are never rebuilt.'],
['Null safety (?, ?., ?:, !!)','val n: String? = null\nval len = n?.length ?: 0\nval s: String = n!!','?, ?., ??, !','String? n;\nfinal len = n?.length ?? 0;\nfinal String s = n!;   // throws if null','The Elvis operator ?: is ?? in Dart, and !! is a single !.'],
['Data class','data class User(val id: Int, val name: String)\nval u2 = u.copy(name = "Ann")','freezed class, or a record','// a record: simple, immutable, has ==\nfinal user = (id: 1, name: \'Taufiq\');\n\n// a full class with copyWith: freezed\nfinal u2 = u.copyWith(name: \'Ann\');','Dart 3 records cover small cases. For models with JSON, use freezed. See "Dio + freezed".'],
['Sealed class and when','sealed class UiState\nobject Loading : UiState()\ndata class Data(val items: List<Todo>) : UiState()\nwhen (state) { is Loading -> ...; is Data -> ... }','sealed class and switch','sealed class UiState {}\nclass Loading extends UiState {}\nclass Data extends UiState { Data(this.items); final List<Todo> items; }\n\nfinal w = switch (state) {\n  Loading() => const Spinner(),\n  Data(:final items) => ListView(children: [for (final i in items) Text(i.title)]),\n};','The switch must cover all subtypes, as in Kotlin. See "UI state: loading, data, error".'],
['Extension function','fun String.initials() = split(" ").map { it[0] }.joinToString("")\n"Taufiq H".initials()','extension','extension Initials on String {\n  String get initials => split(\' \').map((w) => w[0]).join();\n}\n\'Taufiq H\'.initials;','Same idea. Extensions can add getters too.'],
['lateinit and lazy','lateinit var name: String\nval heavy by lazy { compute() }','late and late final','late String name;                 // set before first use\nlate final heavy = compute();     // runs on first read','late with an initializer is lazy. Reading a late value before it is set throws an error.'],
['object (singleton)','object Logger { fun log(m: String) {} }','A top-level function, a static, or get_it','// simplest: top-level\nvoid logMessage(String m) {}\n\n// a single instance\nclass AppLog {\n  AppLog._();\n  static final instance = AppLog._();\n}','Dart has no object keyword. Most singletons are better as a dependency passed in.'],
['Named and default arguments','fun send(to: String, text: String = "Hi", retries: Int = 3) {}\nsend(to = "a", retries = 5)','Named parameters in braces','void send({required String to, String text = \'Hi\', int retries = 3}) {}\nsend(to: \'a\', retries: 5);','Named parameters are used all over Flutter. required marks the ones you must pass.'],
['Lambdas and higher-order functions','val doubled = list.map { it * 2 }.filter { it > 4 }\nbutton.setOnClickListener { save() }','Arrow functions and closures','final doubled = list.map((x) => x * 2).where((x) => x > 4).toList();\nonPressed: () => save(),','map and where return a lazy Iterable, so call toList() when you need a list. filter is where in Dart.'],
['String templates','"Hello $name, you are ${age + 1}"','The same','\'Hello $name, you are ${age + 1}\'','Identical. Single or double quotes both work.'],
['when as an expression','val label = when (n) { 0 -> "none"; 1 -> "one"; else -> "many" }','switch expression','final label = switch (n) { 0 => \'none\', 1 => \'one\', _ => \'many\' };','A switch expression uses => and an underscore for the default case.'],
['Coroutines: suspend and launch','suspend fun load(): List<Todo> = repo.todos()\nscope.launch { val x = load() }','async and await','Future<List<Todo>> load() async => await repo.todos();\nload().then((x) {});   // or: final x = await load();','Every async function returns a Future, and it starts running as soon as you call it. See the Dart async page.'],
['Collections','listOf(1, 2, 3)\nmutableListOf<Int>()\nmapOf("a" to 1)','List, Set and Map literals','final a = [1, 2, 3];           // growable List\nfinal b = <int>[];\nfinal c = {\'a\': 1};            // Map\nfinal d = {1, 2, 3};            // Set','There is no separate immutable type. Use const [1, 2] or List.unmodifiable.'],
['Visibility','private fun x() {}\ninternal class A\nclass B(private val v: Int)','A leading underscore','class B {\n  final int _v;       // private to the file (library)\n  B(this._v);\n}','Dart has no private, public or protected keywords. A name that starts with an underscore is private to its file.']
]});

dartPage({id:'dart-null-safety',name:'Dart null safety: what compiles and what crashes',label:'example',
tags:'dart null safety nullable non-nullable question mark safe call null aware elvis bang operator late smart cast promotion lateinitializationerror null check operator',
blurb:'In Dart a type cannot hold null unless you add a question mark. The compiler checks this, so most null errors become compile errors instead of crashes on a user\'s phone.',
use:'Every line of Dart you write. Understanding it makes the red errors in your editor easy to fix.',
watch:'The bang operator (!) turns a compile check into a crash, so use it only when you are certain. late also moves the check to run time. A field can be promoted by an if check only when it is a local variable or a final field, not a changing property.',
items:[
['non-nullable cannot be null','String name = null;','Compile error: A value of type \'Null\' can\'t be assigned to a variable of type \'String\'.','String without a question mark can never be null, and the compiler stops you.'],
['nullable type (?)','String? name = null;\nprint(name);','null','String? means "a String, or null". This is allowed.'],
['using a nullable directly','String? name;\nprint(name.length);','Compile error: The property \'length\' can\'t be unconditionally accessed because the receiver can be \'null\'.','The compiler knows name may be null, so it will not let you call a member on it.'],
['safe call ?.','String? name;\nprint(name?.length);','null','?. stops and gives null when the left side is null. It is the same as in Kotlin.'],
['default value ??','String? name;\nprint(name ?? \'guest\');','guest','?? is the Elvis operator (?: in Kotlin). It uses the right side when the left is null.'],
['assign if null ??=','String? name;\nname ??= \'guest\';\nprint(name);','guest','??= sets the variable only when it is null.'],
['smart cast with if','String? name = \'Taufiq\';\nif (name != null) {\n  print(name.length);   // name is a String here\n}','6','After the null check, the compiler treats name as non-null inside the if. This is called promotion.'],
['bang ! (risky)','String? name;\nprint(name!.length);','Runtime error: Null check operator used on a null value','! says "I promise this is not null". If you are wrong, the app crashes. Prefer ?. , ?? or an if check.'],
['late used before set','late String token;\nprint(token);','Runtime error: LateInitializationError: Field \'token\' has not been initialized.','late promises you will set the value before you read it. The check happens at run time, so be careful.'],
['null-aware spread ...?','List<int>? extra;\nfinal all = [1, 2, ...?extra];\nprint(all);','[1, 2]','...? adds the items only when the list is not null.']
]});

dartPage({id:'dart-classes',name:'Dart 3 features: records, patterns, sealed classes, mixins',label:'feature',
tags:'dart 3 records patterns destructuring enhanced enum sealed class switch expression extension method mixin factory constructor const constructor named constructor immutable identical',
blurb:'Dart 3 added records, patterns and sealed classes. They let you return several values, take apart a map, and make a switch that must cover every case. Mixins, extensions and constructors are the other Dart tools you meet in Flutter code.',
use:'Reading modern Flutter code, and modelling states and results without extra packages.',
watch:'Records are good for small, local data. For a model with JSON and copyWith, use a class (or freezed). A switch on a sealed class has no default, so a new subclass makes the compiler point at every switch to update. Mixins share behaviour but not state they cannot own, so keep them small.',
items:[
['record','final user = (id: 1, name: \'Taufiq\');\nprint(user.name);\nprint(user);','Taufiq\n(id: 1, name: Taufiq)','A record groups values without a class. It has == and a readable print for free.'],
['pattern: take apart a map','final json = {\'name\': \'Taufiq\', \'age\': 30};\nif (json case {\'name\': String name, \'age\': int age}) {\n  print(\'$name is $age\');\n}','Taufiq is 30','The pattern checks the shape and types, and binds the variables in one step. If the map does not match, the if is skipped.'],
['pattern: destructuring','final (x, y) = (3, 4);\nprint(x + y);','7','A record can be taken apart into variables in one line. This is also how a function can return two values.'],
['enhanced enum','enum Plan {\n  free(0),\n  pro(9);\n  const Plan(this.price);\n  final int price;\n}\nprint(Plan.pro.price);\nprint(Plan.values.length);','9\n2','Enums can have fields, constructors and methods, so you rarely need a separate lookup map.'],
['sealed class + switch','sealed class Shape {}\nclass Circle extends Shape {\n  Circle(this.r);\n  final double r;\n}\nclass Square extends Shape {\n  Square(this.side);\n  final double side;\n}\n\ndouble area(Shape shape) => switch (shape) {\n  Circle(:final r) => 3.14 * r * r,\n  Square(:final side) => side * side,\n};\nprint(area(Square(3)));','9.0','The compiler knows every subtype of a sealed class, so the switch needs no default and cannot miss a case. This is how UiState and Result types are made.'],
['extension method','extension on String {\n  String get initials => split(\' \').map((w) => w[0]).join();\n}\nprint(\'Taufiq Hidayat\'.initials);','TH','An extension adds a method or getter to an existing type without changing it. It is like a Kotlin extension function.'],
['mixin','mixin Logs {\n  void log(String m) => print(\'[LOG] $m\');\n}\nclass Repo with Logs {\n  void load() => log(\'loading\');\n}\nRepo().load();','[LOG] loading','A mixin adds methods to a class without inheritance. State classes use mixins such as SingleTickerProviderStateMixin.'],
['factory constructor','class User {\n  User(this.name);\n  final String name;\n  factory User.fromJson(Map<String, dynamic> j) =>\n      User(j[\'name\'] as String);\n}\nprint(User.fromJson({\'name\': \'Taufiq\'}).name);','Taufiq','A factory constructor can run code and return an existing or different instance. fromJson is the usual example.'],
['const constructor','class Point {\n  const Point(this.x, this.y);\n  final int x, y;\n}\nconst a = Point(1, 2);\nconst b = Point(1, 2);\nprint(identical(a, b));','true','const objects with the same values are created once and shared. That is why const widgets cost nothing to rebuild.'],
['cascade ..','final buffer = StringBuffer()\n  ..write(\'a\')\n  ..write(\'b\')\n  ..write(\'c\');\nprint(buffer);','abc','.. calls a method and then gives back the same object, so you can chain setup calls. You see it with controllers and paints.']
]});

dartPage({id:'dart-collections',name:'Dart collections: map, where, fold and friends',label:'example',
tags:'dart list map set where fold reduce sort spread collection if for iterable lazy tolist entries putifabsent firstwhere any every unmodifiable const list groupby',
blurb:'Lists, maps and sets have the same helper methods you know from Kotlin, with a few different names. Dart also lets you put if and for inside a list literal, which is very common in widget code.',
use:'Turning API data into widgets, filtering lists, and building children for a Column.',
watch:'map and where are lazy: they return an Iterable that runs only when you read it, so call toList() when you need a list. A const list cannot be changed. Do not change a list while you loop over it.',
items:[
['spread, if and for in a list','final extra = [3, 4];\nfinal list = [\n  1, 2,\n  ...extra,\n  if (extra.isNotEmpty) 5,\n  for (var i = 6; i < 8; i++) i,\n];\nprint(list);','[1, 2, 3, 4, 5, 6, 7]','Collection if and for are used in Column(children: [...]) all the time.'],
['where + map (filter + transform)','final nums = [1, 2, 3, 4, 5];\nfinal r = nums.where((n) => n.isOdd).map((n) => n * 10).toList();\nprint(r);','[10, 30, 50]','where is filter in Kotlin. Remember toList().'],
['fold (sum)','final total = [1, 2, 3, 4].fold<int>(0, (sum, n) => sum + n);\nprint(total);','10','fold starts from an initial value. reduce does the same without one, but it fails on an empty list.'],
['sort with a comparison','final names = [\'Ann\', \'bob\', \'Cy\'];\nnames.sort((a, b) => a.toLowerCase().compareTo(b.toLowerCase()));\nprint(names);','[Ann, bob, Cy]','sort changes the list in place. Copy first with [...names] if you must keep the original.'],
['group items in a map','final words = [\'apple\', \'avocado\', \'banana\'];\nfinal byLetter = <String, List<String>>{};\nfor (final w in words) {\n  byLetter.putIfAbsent(w[0], () => []).add(w);\n}\nprint(byLetter);','{a: [apple, avocado], b: [banana]}','putIfAbsent creates the list the first time. The collection package also has groupBy.'],
['loop over map entries','final prices = {\'tea\': 2, \'cake\': 5};\nfor (final e in prices.entries) {\n  print(\'${e.key}: ${e.value}\');\n}\nprint(prices.keys.toList());','tea: 2\ncake: 5\n[tea, cake]','entries gives key and value together. A map keeps the order of insertion.'],
['set operations','final a = {1, 2, 3};\nfinal b = {2, 3, 4};\nprint(a.intersection(b));\nprint(a.union(b));','{2, 3}\n{1, 2, 3, 4}','A set holds each value once. {} with items and no colons is a Set, and an empty {} is a Map.'],
['any, every, firstWhere','final n = [2, 4, 6];\nprint(n.any((x) => x > 5));\nprint(n.every((x) => x.isEven));\nprint(n.firstWhere((x) => x > 2));','true\ntrue\n4','firstWhere throws if nothing matches. Add orElse: () => ... or use firstOrNull.'],
['lazy map gotcha','final it = [1, 2, 3].map((x) {\n  print(\'mapping $x\');\n  return x * 2;\n});\nprint(\'before\');\nprint(it.toList());','before\nmapping 1\nmapping 2\nmapping 3\n[2, 4, 6]','The function inside map did not run until toList(). Calling it twice would run it twice.'],
['unmodifiable const list','const list = [1, 2];\nlist.add(3);','Runtime error: Unsupported operation: Cannot add to an unmodifiable list','A const list is fixed. Use a normal list literal, or List.of(list), when you need to change it.']
]});

def({cat:DL,id:'dart-async',name:'Dart async: await, Future.wait, forgotten await and Stream',tags:'dart async await future futurewait unawaited stream listen asyncstar yield event loop microtask parallel sequential timeout completer timeline',h:420,
blurb:'A Future is a value that arrives later. await pauses your function (not the app) until it arrives. Three tasks that take 300, 500 and 200 ms take 1000 ms one after another, but only 500 ms together with Future.wait.',
use:'Calling APIs, reading files and databases, and any work that takes time.',
watch:'Calling an async function without await still starts it, but you cannot catch its error or wait for it. The error goes to PlatformDispatcher.onError. Do not await in a loop when the calls do not depend on each other. Always check context.mounted after an await before you use the context.',
ctl:[{k:'p',l:'pattern',t:'sel',o:['await one after another','Future.wait (parallel)','forgotten await','Stream (many values)'],v:'await one after another'}],
render(s,st,g,d){
 const T=[['A',300],['B',500],['C',200]];
 let bars='',total=0,note='';
 const row=(n,st0,w,c)=>`<div style="display:flex;align-items:center;gap:6px"><div style="width:18px;font:700 11px var(--f-mono)">${n}</div><div style="flex:1;position:relative;height:20px;background:var(--line);border-radius:5px"><div style="position:absolute;left:${st0/10}%;width:${w/10}%;height:20px;border-radius:5px;background:${c}"></div></div></div>`;
 if(s.p==='await one after another'){let t=0;T.forEach(([n,w])=>{bars+=row(n,t,w,'var(--c1)');t+=w});total=t;note='Each await waits for the one before. 300 + 500 + 200.'}
 else if(s.p==='Future.wait (parallel)'){T.forEach(([n,w])=>{bars+=row(n,0,w,'var(--ok)')});total=500;note='All three start together. The total is the slowest one.'}
 else if(s.p==='forgotten await'){T.forEach(([n,w])=>{bars+=row(n,0,w,'var(--danger)')});total=0;note='The function returned at 0 ms, before any task finished. Errors from these tasks are lost, and the next line runs too early.'}
 else{[0,300,600,900].forEach((t,i)=>{bars+=`<div style="display:flex;align-items:center;gap:6px"><div style="width:18px;font:700 11px var(--f-mono)">${i}</div><div style="flex:1;position:relative;height:20px"><div style="position:absolute;left:${t/10}%;width:14px;height:14px;top:3px;border-radius:50%;background:var(--c1)"></div></div></div>`});total=900;note='A Stream gives many values over time. listen or await for runs once per value.'}
 g.innerHTML=nbx(`<div style="font:600 10.5px var(--f-mono);color:var(--muted)">TIME (0 to 1000 ms)</div>${bars}<div style="display:flex;justify-content:space-between;font:11px var(--f-mono);color:var(--muted)"><span>0</span><span>500</span><span>1000 ms</span></div><div style="font:700 15px var(--f-mono)">${s.p==='forgotten await'?'returns at 0 ms':'total '+total+' ms'}</div><div style="font-size:12.5px;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)">${esc(note)}</div>`);
 const C={'await one after another':`Future<void> loadAll() async {\n  final a = await fetchA();   // 300 ms\n  final b = await fetchB();   // 500 ms\n  final c = await fetchC();   // 200 ms\n  // total 1000 ms\n}`,'Future.wait (parallel)':`Future<void> loadAll() async {\n  final results = await Future.wait([\n    fetchA(),   // all three start now\n    fetchB(),\n    fetchC(),\n  ]);\n  // total 500 ms. results[0] is A, and so on.\n\n  // records give you typed results (Dart 3)\n  final (a, b, c) = await (fetchA(), fetchB(), fetchC()).wait;\n}`,'forgotten await':`Future<void> loadAll() async {\n  fetchA();               // no await: starts, but nobody waits\n  fetchB();\n  print('done');          // prints before A or B finish\n}\n// the analyzer warns: unawaited_futures\n// if you really want fire-and-forget, say so:\nunawaited(fetchA());     // from dart:async`,'Stream (many values)':`Stream<int> ticks() async* {\n  for (var i = 0; i < 4; i++) {\n    await Future.delayed(const Duration(milliseconds: 300));\n    yield i;                // one value\n  }\n}\n\nawait for (final t in ticks()) {\n  print(t);\n}\n// or, in a widget: StreamBuilder(stream: ticks(), builder: ...)\nfinal sub = ticks().listen(print);\nsub.cancel();               // always cancel in dispose()`};
 return {code:C[s.p],hint:'Switch the pattern and compare the bars. Parallel is faster only when the tasks do not depend on each other.'};
}});

def({cat:WE,id:'todo-walkthrough',name:'Build a todo app, layer by layer',tags:'todo app example walkthrough tutorial end to end model repository viewmodel changenotifier provider listenablebuilder listview.builder test project feature mvvm complete app',h:450,
blurb:'This page builds one small app from the pages in this atlas: a model, a repository, a ViewModel, a screen, the wiring and a test. The mini app on the left is the result. Pick a layer to see the file that makes it.',
use:'Seeing how the separate topics (state, layers, lists, testing) fit into one working app.',
watch:'The example keeps data in memory so it stays short. To save it, swap MemoryTodoRepository for one that uses drift or shared_preferences, and nothing else changes. That swap is the reason the repository exists. The code is plain Flutter plus provider, so the same layers work with Riverpod or Bloc.',
ctl:[{k:'layer',l:'show the file',t:'sel',o:['1 Model','2 Repository','3 ViewModel','4 Screen','5 Wiring','6 Test'],v:'3 ViewModel'},{k:'f',l:'filter',t:'sel',o:['all','active','done'],v:'all'}],
render(s,st,g,d){
 if(!st.todos){st.todos=[{t:'Buy milk',d:0},{t:'Call mom',d:1}];st.n=2}
 const L=+s.layer[0];
 const left=st.todos.filter(x=>!x.d).length;
 const vis=st.todos.map((x,i)=>({x,i})).filter(({x})=>s.f==='all'||(s.f==='active'?!x.d:x.d));
 const files=['lib/todos/todo.dart','lib/todos/todo_repository.dart','lib/todos/todo_view_model.dart','lib/todos/todo_screen.dart','lib/main.dart','test/todo_view_model_test.dart'];
 const lay=['Model','Repository','ViewModel','Screen','Wiring','Test'];
 const hit=(n)=>L===n?'var(--c1)':'var(--line)';
 g.innerHTML=nbx(`<div style="border:1.5px solid ${hit(4)};border-radius:12px;background:var(--surface);overflow:hidden"><div style="background:var(--c1);color:#fff;padding:7px 12px;font:700 13px var(--f-body);display:flex;justify-content:space-between"><span>Todos</span><span style="font-weight:500">${left} left</span></div><div style="padding:6px 8px;min-height:120px">${vis.length?vis.map(({x,i})=>`<div style="display:flex;align-items:center;gap:8px;padding:5px 4px;border-bottom:1px solid var(--line)"><span data-a="t${i}" style="cursor:pointer;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--c1);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--c1);flex:none">${x.d?'&#10003;':''}</span><span style="flex:1;font-size:13px;${x.d?'text-decoration:line-through;color:var(--muted)':''}">${esc(x.t)}</span><span data-a="x${i}" style="cursor:pointer;color:var(--muted);padding:0 4px">&#10005;</span></div>`).join(''):'<div style="color:var(--muted);font-size:12.5px;padding:10px 4px">Nothing here.</div>'}</div><div style="padding:6px 8px;display:flex;gap:6px">${nbtn('add','Add todo','Filled')}${nbtn('clr','Clear done')}</div></div><div style="display:flex;gap:5px;flex-wrap:wrap">${lay.map((n,i)=>`<span style="padding:3px 9px;border-radius:7px;font:11.5px var(--f-mono);border:1.5px solid ${hit(i+1)};background:${L===i+1?'var(--c1s)':'transparent'}">${n}</span>`).join('')}</div><div style="font:12px var(--f-mono);color:var(--muted);overflow-wrap:anywhere">${esc(files[L-1])}</div>`);
 const C=[`// lib/todos/todo.dart\nclass Todo {\n  const Todo({required this.id, required this.title, this.done = false});\n  final int id;\n  final String title;\n  final bool done;\n\n  Todo copyWith({String? title, bool? done}) =>\n      Todo(id: id, title: title ?? this.title, done: done ?? this.done);\n}\n// immutable: change a todo by making a new one. freezed can write this for you.`,
`// lib/todos/todo_repository.dart\nabstract class TodoRepository {\n  Future<List<Todo>> all();\n  Future<void> save(List<Todo> todos);\n}\n\nclass MemoryTodoRepository implements TodoRepository {\n  List<Todo> _items = const [\n    Todo(id: 1, title: 'Buy milk'),\n    Todo(id: 2, title: 'Call mom', done: true),\n  ];\n  @override\n  Future<List<Todo>> all() async => _items;\n  @override\n  Future<void> save(List<Todo> todos) async => _items = List.of(todos);\n}\n// later: a DriftTodoRepository with the same two methods.`,
`// lib/todos/todo_view_model.dart\nenum Filter { all, active, done }\n\nclass TodoViewModel extends ChangeNotifier {\n  TodoViewModel(this._repo);\n  final TodoRepository _repo;\n  List<Todo> _todos = [];\n  Filter filter = Filter.${s.f};\n\n  List<Todo> get visible => switch (filter) {\n    Filter.all => _todos,\n    Filter.active => _todos.where((t) => !t.done).toList(),\n    Filter.done => _todos.where((t) => t.done).toList(),\n  };\n  int get left => _todos.where((t) => !t.done).length;\n\n  Future<void> load() async {\n    _todos = await _repo.all();\n    notifyListeners();\n  }\n\n  Future<void> add(String title) async {\n    _todos = [..._todos, Todo(id: _todos.length + 1, title: title)];\n    await _repo.save(_todos);\n    notifyListeners();\n  }\n\n  Future<void> toggle(int id) async {\n    _todos = [for (final t in _todos) t.id == id ? t.copyWith(done: !t.done) : t];\n    await _repo.save(_todos);\n    notifyListeners();\n  }\n\n  void setFilter(Filter f) { filter = f; notifyListeners(); }\n}`,
`// lib/todos/todo_screen.dart\nclass TodoScreen extends StatelessWidget {\n  const TodoScreen({super.key});\n  @override\n  Widget build(BuildContext context) {\n    final vm = context.watch<TodoViewModel>();   // rebuilds on notifyListeners\n    return Scaffold(\n      appBar: AppBar(title: Text('Todos (\${vm.left} left)')),\n      body: ListView.builder(\n        itemCount: vm.visible.length,\n        itemBuilder: (context, i) {\n          final t = vm.visible[i];\n          return CheckboxListTile(\n            value: t.done,\n            title: Text(t.title),\n            onChanged: (_) => context.read<TodoViewModel>().toggle(t.id),\n          );\n        },\n      ),\n      floatingActionButton: FloatingActionButton(\n        onPressed: () => context.read<TodoViewModel>().add('New task'),\n        child: const Icon(Icons.add),\n      ),\n    );\n  }\n}`,
`// lib/main.dart\nvoid main() {\n  runApp(\n    ChangeNotifierProvider(\n      create: (_) => TodoViewModel(MemoryTodoRepository())..load(),\n      child: const MaterialApp(home: TodoScreen()),\n    ),\n  );\n}\n// the only place that knows which repository is used`,
`// test/todo_view_model_test.dart\nvoid main() {\n  test('toggle changes the number left', () async {\n    final vm = TodoViewModel(MemoryTodoRepository());\n    await vm.load();\n    expect(vm.left, 1);\n\n    await vm.toggle(1);          // finish "Buy milk"\n    expect(vm.left, 0);\n  });\n\n  test('add puts a todo at the end', () async {\n    final vm = TodoViewModel(MemoryTodoRepository());\n    await vm.load();\n    await vm.add('Pay rent');\n    expect(vm.visible.last.title, 'Pay rent');\n  });\n}`][L-1];

def({cat:SAx,id:'riverpod-deep',name:'Riverpod in depth: providers, ref and auto-dispose',tags:'riverpod provider notifierprovider asyncnotifier asyncnotifierprovider consumerwidget ref watch read listen autodispose family keepalive dependency graph invalidate refresh asyncvalue when guard',h:450,
blurb:'In Riverpod you declare providers as global values, and each one can watch others. When something a provider watches changes, only the providers and widgets that depend on it are rebuilt. Providers that nobody uses can dispose themselves.',
use:'Medium and large apps that need shared state, async data, dependency injection and easy testing in one tool.',
watch:'Use ref.watch inside build and inside provider bodies, ref.read inside callbacks, and ref.listen for side effects like showing a SnackBar. Never call ref.read in build for values the UI shows. The API changed between Riverpod 2 and 3 (and the code generator is optional), so check the docs for your version.',
ctl:[{k:'style',l:'show code for',t:'sel',o:['Notifier (state + methods)','AsyncNotifier (loading, data, error)','derived Provider','family (with a parameter)'],v:'AsyncNotifier (loading, data, error)'},{k:'auto',l:'autoDispose',t:'chk',v:true}],
render(s,st,g,d){
 if(!st.c){st.c={token:1,dio:1,todos:1};st.open=true}

 const C={'Notifier (state + methods)':`final counterProvider = NotifierProvider<Counter, int>(Counter.new);\n\nclass Counter extends Notifier<int> {\n  @override\n  int build() => 0;                 // the first state\n  void increment() => state++;      // assigning state updates watchers\n}\n\nclass CounterView extends ConsumerWidget {\n  const CounterView({super.key});\n  @override\n  Widget build(BuildContext context, WidgetRef ref) {\n    final n = ref.watch(counterProvider);          // rebuild when it changes\n    return FilledButton(\n      onPressed: () => ref.read(counterProvider.notifier).increment(),   // read in callbacks\n      child: Text('$n'),\n    );\n  }\n}\n// main: runApp(const ProviderScope(child: MyApp()));`,
 'AsyncNotifier (loading, data, error)':`final dioProvider = Provider<Dio>((ref) {\n  final token = ref.watch(tokenProvider);        // token changes -> new Dio\n  return Dio(BaseOptions(headers: {'Authorization': 'Bearer $token'}));\n});\n\nfinal todosProvider = ${s.auto?'AsyncNotifierProvider.autoDispose':'AsyncNotifierProvider'}<TodosNotifier, List<Todo>>(TodosNotifier.new);\n\nclass TodosNotifier extends ${s.auto?'AutoDisposeAsyncNotifier':'AsyncNotifier'}<List<Todo>> {\n  @override\n  Future<List<Todo>> build() async {\n    final dio = ref.watch(dioProvider);          // rebuilds when dio changes\n    final res = await dio.get<List<dynamic>>('/todos');\n    return [for (final j in res.data!) Todo.fromJson(j as Map<String, dynamic>)];\n  }\n\n  Future<void> add(String title) async {\n    state = const AsyncLoading();\n    state = await AsyncValue.guard(() async {\n      await ref.read(dioProvider).post('/todos', data: {'title': title});\n      return build();                            // load the list again\n    });\n  }\n}\n\n// UI: loading, data and error in one place\nref.watch(todosProvider).when(\n  data: (todos) => TodoList(todos),\n  loading: () => const CircularProgressIndicator(),\n  error: (e, st) => ErrorView(message: '$e', onRetry: () => ref.invalidate(todosProvider)),\n);\n// Riverpod 3 changed some names (for example no separate AutoDispose classes). Check your version.`,
 'derived Provider':`// a value computed from other providers, cached and rebuilt only when they change\nfinal doneCountProvider = Provider<int>((ref) {\n  final todos = ref.watch(todosProvider).value ?? const <Todo>[];\n  return todos.where((t) => t.done).length;\n});\n\n// only widgets that watch doneCountProvider rebuild when the count changes\nfinal count = ref.watch(doneCountProvider);\n\n// watch just one field of a bigger object\nfinal name = ref.watch(userProvider.select((u) => u.name));`,
 'family (with a parameter)':`// one provider per id\nfinal todoProvider = FutureProvider.family<Todo, int>((ref, id) async {\n  final res = await ref.watch(dioProvider).get<Map<String, dynamic>>('/todos/$id');\n  return Todo.fromJson(res.data!);\n});\n\nref.watch(todoProvider(7));        // cached per id\nref.invalidate(todoProvider(7));  // reload one\n\n// tests: replace any provider\nProviderScope(\n  overrides: [dioProvider.overrideWithValue(FakeDio())],\n  child: const MyApp(),\n);`}[s.style];
 return {code:C,hint:'Press "Token changes": the Dio and todo providers rebuild, but the token provider does not. Leave and re-open the screen with autoDispose on and off.'};
},

def({cat:SAx,id:'bloc-deep',name:'Bloc and Cubit in depth: events, states and transitions',tags:'bloc cubit flutter_bloc blocprovider blocbuilder blocconsumer bloclistener blocselector event state emit transition equatable on handler buildwhen listenwhen login state machine',h:450,
blurb:'A Cubit is a class with methods that call emit(newState). A Bloc is a Cubit with events: the UI adds an event, and a handler turns it into new states. Both keep every change in one place and make state changes easy to log and test.',
use:'Apps with clear flows (login, checkout), teams that like strict structure, and logic you want to test as "event in, states out".',
watch:'States should be immutable and comparable (use Equatable or freezed), or the UI will not rebuild correctly. Do not put UI code in the Bloc. Use BlocListener (or listenWhen) for one-time actions like navigation, and BlocBuilder for drawing. Start with Cubit, and move to Bloc when you need event tracing, transformers (debounce) or many inputs.',
ctl:[{k:'kind',l:'type',t:'sel',o:['Cubit','Bloc (events)'],v:'Bloc (events)'}],
render(s,st,g,d){
 if(!st.state){st.state='Initial';st.log=[]}
 const blocK=s.kind.startsWith('Bloc');
 const col={Initial:'var(--muted)',Editing:'var(--c1)',Submitting:'var(--c3t)',Success:'var(--ok)',Failure:'var(--danger)'}[st.state];
 g.innerHTML=nbx(`<div style="display:flex;gap:6px;flex-wrap:wrap">${nbtn('typ',blocK?'add EmailChanged':'emailChanged()')}${nbtn('sub',blocK?'add SubmitPressed':'submit()','Filled')}${nbtn('ok','server: OK')}${nbtn('bad','server: error')}${nbtn('clr','Reset')}</div><div style="border:1.5px solid ${col};border-radius:10px;padding:8px 12px;background:var(--surface)"><div style="font:600 10.5px var(--f-mono);color:var(--muted)">CURRENT STATE</div><div style="font:700 19px var(--f-mono);color:${col}">${st.state}</div></div><div style="font:600 10.5px var(--f-mono);color:var(--muted)">BlocObserver LOG (${blocK?'onTransition':'onChange'})</div><div style="flex:1;overflow:auto;font:11.5px/1.6 var(--f-mono);border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface);overflow-wrap:anywhere">${st.log.length?st.log.slice(-6).map(x=>esc(x)).join('<br>'):'<span style="color:var(--muted)">Press a button.</span>'}</div>`);
 const C={'Cubit':`class LoginState extends Equatable {\n  const LoginState({this.email = '', this.status = Status.initial});\n  final String email;\n  final Status status;\n  LoginState copyWith({String? email, Status? status}) =>\n      LoginState(email: email ?? this.email, status: status ?? this.status);\n  @override\n  List<Object?> get props => [email, status];   // equality, so the UI knows when it changed\n}\nenum Status { initial, editing, submitting, success, failure }\n\nclass LoginCubit extends Cubit<LoginState> {\n  LoginCubit(this._auth) : super(const LoginState());\n  final AuthRepository _auth;\n\n  void emailChanged(String v) =>\n      emit(state.copyWith(email: v, status: Status.editing));\n\n  Future<void> submit() async {\n    emit(state.copyWith(status: Status.submitting));\n    try {\n      await _auth.login(state.email);\n      emit(state.copyWith(status: Status.success));\n    } catch (_) {\n      emit(state.copyWith(status: Status.failure));\n    }\n  }\n}\n\n// UI\nBlocProvider(\n  create: (_) => LoginCubit(context.read<AuthRepository>()),\n  child: BlocConsumer<LoginCubit, LoginState>(\n    listenWhen: (p, c) => p.status != c.status,\n    listener: (context, s) { if (s.status == Status.success) context.go('/home'); },\n    builder: (context, s) => FilledButton(\n      onPressed: s.status == Status.submitting ? null : context.read<LoginCubit>().submit,\n      child: Text(s.status == Status.submitting ? 'Signing in...' : 'Sign in'),\n    ),\n  ),\n);`,
 'Bloc (events)':`sealed class LoginEvent {}\nclass EmailChanged extends LoginEvent { EmailChanged(this.email); final String email; }\nclass SubmitPressed extends LoginEvent {}\n\nclass LoginBloc extends Bloc<LoginEvent, LoginState> {\n  LoginBloc(this._auth) : super(const LoginState()) {\n    on<EmailChanged>((e, emit) =>\n        emit(state.copyWith(email: e.email, status: Status.editing)));\n    on<SubmitPressed>(_onSubmit);\n  }\n  final AuthRepository _auth;\n\n  Future<void> _onSubmit(SubmitPressed e, Emitter<LoginState> emit) async {\n    emit(state.copyWith(status: Status.submitting));\n    try {\n      await _auth.login(state.email);\n      emit(state.copyWith(status: Status.success));\n    } catch (_) {\n      emit(state.copyWith(status: Status.failure));\n    }\n  }\n}\n\n// UI sends events\ncontext.read<LoginBloc>().add(EmailChanged(text));\ncontext.read<LoginBloc>().add(SubmitPressed());\n\n// draw only when one field changes\nBlocSelector<LoginBloc, LoginState, bool>(\n  selector: (s) => s.status == Status.submitting,\n  builder: (context, busy) => busy ? const LinearProgressIndicator() : const SizedBox(),\n);\n\n// debounce typing: on<EmailChanged>(handler, transformer: debounce(300ms))  (package: stream_transform)\n\n// test: event in, states out (package: bloc_test)\nblocTest<LoginBloc, LoginState>('login works',\n  build: () => LoginBloc(FakeAuth()),\n  act: (b) => b..add(EmailChanged('a@b.c'))..add(SubmitPressed()),\n  expect: () => [isA<LoginState>(), isA<LoginState>(), isA<LoginState>()],\n);`}[s.kind];
 return {code:C,hint:'Press the buttons in order: typing, submit, then a server result. Pressing a button at the wrong time is ignored, which is how a state machine keeps the screen consistent.'};
},

}});

 const C={'email + password':`final auth = FirebaseAuth.instance;\n\nFuture<void> signIn(String email, String password) async {\n  try {\n    await auth.signInWithEmailAndPassword(email: email, password: password);\n    // no navigation here: authStateChanges fires and the router reacts\n  } on FirebaseAuthException catch (e) {\n    switch (e.code) {\n      case 'invalid-credential':          // wrong email or password (newer SDKs)\n      case 'wrong-password':              // older SDKs\n      case 'user-not-found':\n        throw const InvalidCredentials();\n      case 'too-many-requests':\n        throw const TryLater();\n      case 'network-request-failed':\n        throw const NetworkException();\n      default:\n        rethrow;\n    }\n  }\n}\n\n// create an account, reset a password, sign out\nawait auth.createUserWithEmailAndPassword(email: email, password: password);\nawait auth.sendPasswordResetEmail(email: email);\nawait auth.signOut();`,

 const C=[`// pigeons/messages.dart  (this file is only read by pigeon, not by the app)\nimport 'package:pigeon/pigeon.dart';\n\n@ConfigurePigeon(PigeonOptions(\n  dartOut: 'lib/src/messages.g.dart',\n  kotlinOut: 'android/app/src/main/kotlin/com/example/app/Messages.g.kt',\n  kotlinOptions: KotlinOptions(package: 'com.example.app'),\n  swiftOut: 'ios/Runner/Messages.g.swift',\n))\n\nenum Charging { yes, no, unknown }\n\nclass BatteryInfo {\n  BatteryInfo({required this.level, required this.charging});\n  int level;\n  Charging charging;\n}\n\n@HostApi()                      // Dart calls native\nabstract class BatteryApi {\n  BatteryInfo getBattery();\n  @async\n  void shutdownSafely(String reason);   // native answers later\n}\n\n@FlutterApi()                   // native calls Dart\nabstract class BatteryEvents {\n  void onLevelChanged(int level);\n}`,`# pubspec.yaml\ndev_dependencies:\n  pigeon: ^latest        # use the current version number\n\n# terminal, from the project root. Run it again after every change.\ndart run pigeon --input pigeons/messages.dart\n\n# It writes:\n#   lib/src/messages.g.dart      (class BatteryApi, enum, BatteryInfo)\n#   Messages.g.kt                (interface BatteryApi, BatteryEvents)\n#   Messages.g.swift             (protocol BatteryApi)\n# Do not edit the .g files. Commit them.`,`// MainActivity.kt\nclass BatteryImpl(private val ctx: Context) : BatteryApi {\n  override fun getBattery(): BatteryInfo {\n    val bm = ctx.getSystemService(Context.BATTERY_SERVICE) as BatteryManager\n    val level = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)\n    return BatteryInfo(level.toLong(), if (bm.isCharging) Charging.YES else Charging.NO)\n  }\n  override fun shutdownSafely(reason: String, callback: (Result<Unit>) -> Unit) {\n    callback(Result.success(Unit))\n  }\n}\n\nclass MainActivity : FlutterActivity() {\n  override fun configureFlutterEngine(flutterEngine: FlutterEngine) {\n    super.configureFlutterEngine(flutterEngine def({cat:CI,id:'fastlane',name:'Fastlane: upload to the stores',tags:'fastlane fastfile lane upload_to_play_store upload_to_testflight match gym build_app supply pilot app store connect api key play console json key ruby gemfile ci cd release beta',h:430,

watch:'Run flutter build first; Fastlane then uploads the result (iOS needs flutter build ios --no-codesign before build_app). Use an App Store Connect API key and a Play service account instead of your own password, so no two-factor prompt blocks a server. Keep every key in secrets. Use match to share iOS certificates across the team and CI. Fastlane action options change between versions.',

render(s,st,g,d){

 else g.innerHTML=nbx(sel.map((t,i)=>ncard(['1 BUILD','2 LANE','3 RESULT'][i],esc(t),i===1)).join(narrow)+narrow+ncard('THEN','Testers get the build. You promote it to production by hand.',0));
 const SET=`# Gemfile  (in android/ and in ios/)\nsource "https://rubygems.org"\ngem "fastlane"\n\n# terminal\ncd ios && bundle install\nbundle exec fastlane init        # creates fastlane/Appfile and Fastfile\n# iOS certificates shared by the team and CI:\nbundle exec fastlane match init\nbundle exec fastlane match appstore\n\n# fastlane/Appfile (Android)\njson_key_file("play-service-account.json")   # or use json_key_data in the lane\npackage_name("com.example.app")`;
 const AN=`# android/fastlane/Fastfile\ndefault_platform(:android)\n\nplatform :android do\n  desc "Upload the bundle to the internal testing track"\n  lane :beta do\n    upload_to_play_store(\n      track: "internal",\n      aab: "../build/app/outputs/bundle/release/app-release.aab",\n      json_key_data: ENV["PLAY_JSON_KEY"],    # the JSON text from a secret\n      skip_upload_metadata: true,\n      skip_upload_images: true,\n      skip_upload_screenshots: true,\n    )\n  end\n\n  desc "Move the tested build to production"\n  lane :promote do\n    upload_to_play_store(\n      track: "internal", track_promote_to: "production",\n      json_key_data: ENV["PLAY_JSON_KEY"], skip_upload_aab: true,\n    )\n  end\nend\n\n# run:   flutter build appbundle --release\n#        cd android && bundle exec fastlane beta`;
