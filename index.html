use:'Anything that scrolls. Use builder or separated for long or unknown-length lists.',

render(s,st,g){

},
after(g,st,s,draw,d){
 const sc=g.querySelector('.scr'),inn=g.querySelector('.in');
 const n=+s.n,sep=s.kind==='separated',row=sep?54:44,lazy=s.kind!=='children';
 const item=i=>`<div class="li"><span>${i}</span>Item ${i}</div>`+(sep&&i<n-1?'<div class="sepr"></div>':'');

  const top=sc.scrollTop,view=sc.clientHeight;st.top=top;

  let h='';for(let i=a;i<=b;i++)h+=item(i);

 };

def({cat:'Display',id:'opacity',name:'Opacity',tags:'transparent alpha fade withopacity',

def({cat:'Input',id:'text-field',name:'TextField',tags:'input form textformfield decoration inputdecoration label hint obscure password error',h:300,

def({cat:'Input',id:'toggles',name:'Checkbox, Switch & Radio',tags:'checkbox switch radio tristate radiogroup selection',

def({cat:'Structure',id:'scaffold',name:'Scaffold',tags:'appbar drawer fab floatingactionbutton bottomnavigationbar snackbar material page',h:340,

 const a=[];
 if(s.ab)a.push("appBar: AppBar(title: Text('"+T[st.t]+"')),");

 if(s.fab){a.push('floatingActionButton: FloatingActionButton(','  onPressed: () => showSnackBar(),','  child: Icon(Icons.add),','),');a.push('floatingActionButtonLocation:','    FloatingActionButtonLocation.'+s.loc+',')}
 if(s.nav)a.push('bottomNavigationBar: BottomNavigationBar(','  currentIndex: '+st.t+',','  items: [/* Home, Search, Profile */],','),');

 b.addEventListener('pointerdown',e=>{b.setPointerCapture(e.pointerId);dn={x:e.clientX,y:e.clientY,ox:X,oy:Y,moved:false,long:false};pu=0;clearTimeout(timer);timer=setTimeout(()=>{if(dn&&!dn.moved){dn.long=true;say('onLongPress')}},500);b.style.cursor='grabbing'});

 if(st.shown!==st.n){

def({cat:'Navigation & state',id:'navigator',name:'Navigator',tags:'push pop route materialpageroute stack routes screens go_router',h:290,
blurb:'Navigator manages a stack of routes (screens). push puts a new screen on top, pop removes the top one, and the screen underneath is shown again.',
use:'Moving between screens. For deep links and URL-based routing most apps layer go_router or the Router API on top.',
watch:'Never call Navigator.push straight from build. Use callbacks such as onPressed, and check that the context is still mounted after an await.',
render(s,st,g){
 if(!st.stack)st.stack=['Home'];
 const top=st.stack[st.stack.length-1],deep=st.stack.length>1;
 g.innerHTML=`<div class="nvp"><div class="abar">${deep?`<button class="ib" data-a="pop" aria-label="Back">${ic('back',20)}</button>`:''}<span>${top}</span></div><div class="nvbody"><button class="btn k-Filled" data-a="push">push</button><button class="btn k-Outlined" data-a="rep">pushReplacement</button><button class="btn k-Text" data-a="pop"${deep?'':' disabled'}>pop</button><button class="btn k-Text" data-a="root"${deep?'':' disabled'}>popUntil(first)</button></div></div><div class="nvs">Stack: ${st.stack.map(p=>`<span class="chip c${PAGES.indexOf(p)%4}">${p}</span>`).join(' › ')}</div>`;
 if(st.anim){anim(g.querySelector('.nvp'),st.anim==='push'?[{transform:'translateX(40px)',opacity:0},{transform:'none',opacity:1}]:[{transform:'translateX(-40px)',opacity:0},{transform:'none',opacity:1}],{duration:260,easing:'ease-out'});st.anim=null}
 return {code:`// push a new screen\nNavigator.push(\n  context,\n  MaterialPageRoute(builder: (_) => ${PAGES[st.stack.length%PAGES.length]}Page()),\n);\n\nNavigator.pop(context);\nNavigator.pushReplacement(context, route);\nNavigator.popUntil(context, (r) => r.isFirst);`,hint:'The stack grows with push and shrinks with pop. The top route is the visible screen.'};
},
act(a,st){
 if(a==='push'){st.stack.push(PAGES[st.stack.length%PAGES.length]);st.anim='push'}
 else if(a==='pop'&&st.stack.length>1){st.stack.pop();st.anim='pop'}
 else if(a==='rep'){const t=st.stack.length-1;st.stack[t]=PAGES[(PAGES.indexOf(st.stack[t])+1)%PAGES.length];st.anim='push'}
 else if(a==='root'){st.stack=[st.stack[0]];st.anim='pop'}

 return {code:`class _ParentState extends State<Parent> {\n  int count = 0;\n\n  @override\n  Widget build(BuildContext context) {\n    return Column(children: [\n      Text('count = $count'),\n      ElevatedButton(\n        onPressed: () => setState(() => count++),\n        child: Text('setState'),\n      ),\n      ${s.cs?'const ':''}ChildWidget(),\n    ]);\n  }\n}`,hint:s.cs?'The const child is the same instance every time, so Flutter skips rebuilding it.':'A new ChildWidget is created on every build, so it rebuilds each time the parent does.'};

def({cat:'Navigation & state',id:'future-builder',name:'FutureBuilder',tags:'async future snapshot connectionstate loading error await http',h:280,

use:'Showing a spinner, then data or an error, for a single async call.',
watch:'Never create the Future inside build. Every rebuild would restart the request. Create it once in initState and store it in a field.',

 return {code:`late final Future<List<Item>> _future = fetchItems();\n\nFutureBuilder<List<Item>>(\n  future: _future, // created once, not in build\n  builder: (context, snapshot) {\n    if (snapshot.connectionState == ConnectionState.waiting) {\n      return CircularProgressIndicator();\n    }\n    if (snapshot.hasError) {\n      return Text('Something went wrong');\n    }\n    return Text('Loaded \${snapshot.data!.length} items');\n  },\n)`,hint:'The simulated request takes '+s.dl+' ms'+(s.fail?' and then fails.':'.')};

def({cat:'Common errors',id:'err-setstate-build',name:'setState() called during build',tags:'error setstate markneedsbuild showdialog build during frame postframecallback navigator dialog exception',h:290,

 const bad=`class HomePage extends StatelessWidget {\n  @override\n  Widget build(BuildContext context) {\n    // WRONG: runs while the tree is building\n    showDialog(\n      context: context,\n      builder: (_) => AlertDialog(title: Text('Welcome')),\n    );\n    return Scaffold(body: Text('Home screen'));\n  }\n}`;

def({cat:'Theming and resources',id:'theme-data',name:'ThemeData & ColorScheme.fromSeed',tags:'theme themedata colorscheme fromseed seed material3 useMaterial3 brightness app theme of context best practice',h:340,

def({cat:'Theming and resources',id:'spacing-dimens',name:'Spacing, radius & sizes (dimens)',tags:'dimens spacing padding margin radius size constants tokens appspacing 4 8 grid magic numbers sizedbox gap design tokens responsive breakpoint',h:340,
blurb:'Flutter has no dimens.xml. The standard practice is a small class of const numbers, one scale for spacing (4, 8, 16, 24, 32), one for corner radius, and one for fixed sizes such as icon and button heights. Every screen then uses names, never raw numbers.',
use:'Padding, gaps between widgets, corner radius, icon sizes and breakpoints, so spacing looks the same on every screen and changes in one place.',
watch:'Base the scale on 4 or 8. Use const so there is no runtime cost. Spacing that must follow the user\'s text size or screen size is different: use MediaQuery, LayoutBuilder or a breakpoint helper, not a fixed token.',
ctl:[{k:'pad',l:'padding',t:'sel',o:['xs (4)','sm (8)','md (16)','lg (24)','xl (32)'],v:'md (16)'},{k:'rad',l:'radius',t:'sel',o:['sm (8)','md (12)','lg (20)'],v:'md (12)'},{k:'gap',l:'gap between items',t:'sel',o:['xs (4)','sm (8)','md (16)'],v:'sm (8)'}],
render(s,st,g,d){
 const n=x=>+x.match(/\((\d+)\)/)[1],nm=x=>x.split(' ')[0];
 const p=n(s.pad),r=n(s.rad),gp=n(s.gap);
 g.innerHTML=`<div class="fill" style="align-items:center;justify-content:center"><div style="width:250px;border-radius:${r}px;background:var(--c1s);border:1.5px solid var(--c1);padding:${p}px;position:relative;box-shadow:inset 0 0 0 ${p}px rgba(47,107,255,.12)"><div style="background:var(--surface);border-radius:${Math.max(r-4,2)}px;padding:10px;font-size:13px;margin-bottom:${gp}px">Title row</div><div style="background:var(--surface);border-radius:${Math.max(r-4,2)}px;padding:10px;font-size:13px">Second row</div></div></div>`;
 const code=`// lib/core/theme/app_dimens.dart\nabstract final class AppSpacing {\n  static const double xs = 4;\n  static const double sm = 8;\n  static const double md = 16;\n  static const double lg = 24;\n  static const double xl = 32;\n}\n\nabstract final class AppRadius {\n  static const double sm = 8;\n  static const double md = 12;\n  static const double lg = 20;\n}\n\nabstract final class AppSizes {\n  static const double icon = 24;\n  static const double buttonHeight = 48;\n}\n\n// use the names\nContainer(\n  padding: const EdgeInsets.all(AppSpacing.${nm(s.pad)}),\n  decoration: BoxDecoration(\n    borderRadius: BorderRadius.circular(AppRadius.${nm(s.rad)}),\n  ),\n  child: Column(children: [\n    Text('Title row'),\n    const SizedBox(height: AppSpacing.${nm(s.gap)}),\n    Text('Second row'),\n  ]),\n)`;

def({cat:'Theming and resources',id:'theme-extension',name:'ThemeExtension (custom tokens)',tags:'themeextension custom theme tokens success warning info colors extensions lerp copywith context extension buildcontext',h:330,
blurb:'ThemeData has no slot for "success" or "warning" colours. A ThemeExtension adds your own tokens to the theme. They are available through Theme.of(context), they change with light and dark mode, and they animate when the theme changes.',
use:'App-specific tokens: success and warning colours, a brand gradient, custom shadows, spacing that is part of a design system.',
watch:'A ThemeExtension must implement both copyWith and lerp. Register one const instance per theme (light and dark), and read it with a null check. A small extension on BuildContext keeps the call sites short.',
ctl:[{k:'dark',l:'Brightness.dark',t:'chk',v:false},{k:'sh',l:'shortcut: extension on BuildContext',t:'chk',v:true}],
render(s,st,g,d){
 const tok=s.dark?{success:'#7ad9a0',warning:'#ffc56b',info:'#8bbcff'}:{success:'#1b7f4b',warning:'#b26a00',info:'#1f5fd1'};
 const bg=s.dark?'#14182b':'#ffffff',fg=s.dark?'#e8ebf7':'#14182b';
 g.innerHTML=`<div class="fill" style="align-items:center;justify-content:center"><div style="width:270px;border-radius:14px;padding:14px;background:${bg};color:${fg};border:1px solid var(--line);display:flex;flex-direction:column;gap:8px">${[['success','Payment received'],['warning','Card expires soon'],['info','New version available']].map(([k,t])=>`<div style="display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;border:1.5px solid ${tok[k]};color:${tok[k]};font:600 13px var(--f-body)"><span style="width:10px;height:10px;border-radius:50%;background:${tok[k]}"></span>${t}<span style="margin-left:auto;font:11px var(--f-mono);opacity:.8">${tok[k]}</span></div>`).join('')}</div></div>`;
 const cls=`@immutable\nclass AppTokens extends ThemeExtension<AppTokens> {\n  const AppTokens({\n    required this.success,\n    required this.warning,\n  });\n  final Color success;\n  final Color warning;\n\n  @override\n  AppTokens copyWith({Color? success, Color? warning}) =>\n      AppTokens(\n        success: success ?? this.success,\n        warning: warning ?? this.warning,\n      );\n\n  @override\n  AppTokens lerp(ThemeExtension<AppTokens>? other, double t) {\n    if (other is! AppTokens) return this;\n    return AppTokens(\n      success: Color.lerp(success, other.success, t)!,\n      warning: Color.lerp(warning, other.warning, t)!,\n    );\n  }\n}\n\n// register one per theme\nThemeData(\n  extensions: const [\n    AppTokens(\n      success: Color(${s.dark?'0xFF7AD9A0':'0xFF1B7F4B'}),\n      warning: Color(${s.dark?'0xFFFFC56B':'0xFFB26A00'}),\n    ),\n  ],\n)`;
 const use=s.sh?`\n\n// helper, once\nextension ThemeX on BuildContext {\n  ColorScheme get colors => Theme.of(this).colorScheme;\n  TextTheme get text => Theme.of(this).textTheme;\n  AppTokens get tokens => Theme.of(this).extension<AppTokens>()!;\n}\n\n// use\nText('Paid', style: TextStyle(color: context.tokens.success))`:`\n\n// use\nfinal tokens = Theme.of(context).extension<AppTokens>()!;\nText('Paid', style: TextStyle(color: tokens.success))`;
 return {code:cls+use,hint:'Switch Brightness.dark. Each theme registers its own success and warning values, so the widgets never check the brightness themselves.'};
}});

def({cat:'Theming and resources',id:'theme-best-practices',name:'Theming best practices: do and don\'t',tags:'best practice checklist do dont avoid prefer theme hardcode magic number duplicate deprecated withopacity surfacevariant bodytext1 headline1 textstyle copy',h:340,

const SA='State and architecture';
const row=(t,sub,on,act)=>`<div ${act?`data-a="${act}" `:''}style="${act?'cursor:pointer;':''}padding:7px 10px;border-radius:8px;border:1.5px solid ${on?'var(--c1)':'var(--line)'};background:${on?'var(--c1s)':'var(--surface)'};color:${on?'var(--c1t)':'var(--fg)'};font-size:12.5px;line-height:1.35"><b style="font-weight:700">${t}</b>${sub?`<div style="font-size:11.5px;opacity:.85">${sub}</div>`:''}</div>`;

def({cat:SA,id:'state-scope',name:'Ephemeral state vs app state',tags:'state management setstate ephemeral local app state shared choose which scope lift provider decision',h:340,
blurb:'State is any data that changes while the app runs. Flutter docs split it in two. Ephemeral (local) state lives inside one widget, like the current tab or a text field. App (shared) state is needed by several screens, like the logged-in user or a shopping cart. The kind of state tells you which tool to use.',
use:'Deciding where a piece of data should live before you write any code.',
watch:'Do not put everything in one global store, and do not keep shared data inside a widget. A simple rule: start with setState in the widget that needs it, and move it up only when a second place needs the same data.',
ctl:[{k:'q',l:'what is the data?',t:'sel',o:['Is the password field hidden?','Current tab of a bottom bar','Items in the shopping cart','The logged-in user','Progress of one animation','Todo list loaded from a server'],v:'Items in the shopping cart'}],
render(s,st,g,d){
 const M={
  'Is the password field hidden?':['Ephemeral','Only that one field cares about it.','StatefulWidget + setState'],
  'Current tab of a bottom bar':['Ephemeral','Only the shell screen needs it.','StatefulWidget + setState'],
  'Items in the shopping cart':['App state','The list screen, the cart screen and the badge all read it.','ViewModel (ChangeNotifier) provided to the tree'],
  'The logged-in user':['App state','Many screens and the router depend on it.','Repository + ViewModel provided to the tree'],
  'Progress of one animation':['Ephemeral','Lives and dies with one widget.','State + AnimationController'],
  'Todo list loaded from a server':['App state','It comes from the data layer, which is the source of truth.','Repository in the data layer + ViewModel in the UI layer']};
 const m=M[s.q];
 g.innerHTML=`<div class="fill" style="flex-direction:column;gap:7px;padding:10px">${Object.keys(M).map(k=>row(esc(k),esc(M[k][0]),k===s.q,'q'+k)).join('')}<div style="margin-top:auto;padding:9px 11px;border-radius:8px;background:${m[0]==='Ephemeral'?'var(--c2s)':'var(--c3s)'};color:${m[0]==='Ephemeral'?'var(--c2t)':'var(--c3t)'};font-size:12.5px"><b>${m[0]}.</b> ${esc(m[1])}<br>Use: ${esc(m[2])}</div></div>`;
 const eph=`class _PasswordFieldState extends State<PasswordField> {\n  bool _hidden = true;   // ephemeral: only this widget uses it\n\n  @override\n  Widget build(BuildContext context) {\n    return TextField(\n      obscureText: _hidden,\n      decoration: InputDecoration(\n        suffixIcon: IconButton(\n          icon: Icon(_hidden ? Icons.visibility : Icons.visibility_off),\n          onPressed: () => setState(() => _hidden = !_hidden),\n        ),\n      ),\n    );\n  }\n}`;
 const app=`// shared: lives outside any single widget\nclass CartViewModel extends ChangeNotifier {\n  final List<Product> _items = [];\n  List<Product> get items => List.unmodifiable(_items);\n\n  void add(Product p) {\n    _items.add(p);\n    notifyListeners();   // tell every listener\n  }\n}\n\n// give it to the tree once, read it anywhere below\nChangeNotifierProvider(\n  create: (_) => CartViewModel(),\n  child: const MyApp(),\n)\nfinal cart = context.watch<CartViewModel>();`;
 return {code:m[0]==='Ephemeral'?eph:app,hint:'Click a row. The coloured box shows the kind of state and the usual tool. The Flutter docs say the choice of package is largely a matter of preference, but the question "who needs this data?" always comes first.'};
},
act(a,st,s){if(a[0]==='q'&&a.length>1){s.q=a.slice(1);const sel=document.querySelector('#state-scope .ctl select');if(sel)sel.value=s.q}}});

def({cat:SA,id:'lift-state',name:'setState & lifting state up',tags:'setstate lift state up parent child callback sibling share data stateful stateless valuechanged inherited',h:320,
blurb:'When two widgets need the same value, the value moves up to their closest common parent. The parent passes the value down as a constructor parameter and passes a callback down so the child can ask for a change. This is called lifting state up, and it is the foundation of every state management package.',
use:'Sharing one value between sibling widgets, or between a widget and its parent, before reaching for a package.',
watch:'Passing data through many levels gets tedious ("prop drilling"). That is the point where InheritedWidget, Provider or Riverpod help. They do the same lifting, with less passing around.',
ctl:[{k:'m',l:'where the counter lives',t:'sel',o:['inside each child (not shared)','in the parent (lifted up)'],v:'inside each child (not shared)'}],
render(s,st,g,d){
 if(st.a==null){st.a=0;st.p=0}
 const lifted=s.m.startsWith('in the parent');
 const shownA=lifted?st.p:st.a,shownB=lifted?st.p:0;
 g.innerHTML=`<div class="fill" style="flex-direction:column;gap:10px;padding:12px"><div style="border:1.5px dashed var(--muted);border-radius:12px;padding:12px;flex:1;display:flex;flex-direction:column;gap:10px"><div style="font:600 11px var(--f-mono);color:var(--muted)">PARENT ${lifted?'(owns count = '+st.p+')':'(owns nothing)'}</div><div style="display:flex;gap:10px;flex:1"><div class="fb a" style="flex:1;flex-direction:column;gap:8px;border-radius:10px"><div>Child A</div><div style="font:700 28px var(--f-display)">${shownA}</div><span data-a="inc" class="btn k-Filled" style="padding:6px 14px;font-size:13px">+1</span></div><div class="fb b" style="flex:1;flex-direction:column;gap:8px;border-radius:10px"><div>Child B</div><div style="font:700 28px var(--f-display)">${shownB}</div><div style="font-weight:500;font-size:12px">only shows the count</div></div></div></div></div>`;
 const own=`class ChildA extends StatefulWidget { /* ... */ }\nclass _ChildAState extends State<ChildA> {\n  int _count = 0;    // private to A\n  @override\n  Widget build(BuildContext context) => Column(children: [\n    Text('$_count'),\n    FilledButton(\n      onPressed: () => setState(() => _count++),\n      child: Text('+1'),\n    ),\n  ]);\n}\n\nclass ChildB extends StatelessWidget {\n  @override\n  Widget build(BuildContext context) {\n    return Text('???');  // B cannot see A's _count\n  }\n}`;
 const up=`class Parent extends StatefulWidget { /* ... */ }\nclass _ParentState extends State<Parent> {\n  int _count = 0;    // lifted up: the parent owns it\n  @override\n  Widget build(BuildContext context) => Row(children: [\n    ChildA(\n      count: _count,\n      onIncrement: () => setState(() => _count++),\n    ),\n    ChildB(count: _count),\n  ]);\n}\n\nclass ChildA extends StatelessWidget {\n  const ChildA({super.key, required this.count, required this.onIncrement});\n  final int count;\n  final VoidCallback onIncrement;   // ask the parent to change\n  // ...\n}`;
 return {code:lifted?up:own,hint:lifted?'The parent owns the count. Both children show the same value, and the children can be StatelessWidgets.':'Press +1. Child A has a count and Child B stays at 0, because B has no way to read A\'s private state.'};
},
act(a,st,s){if(a==='inc'){if(s.m.startsWith('in the parent'))st.p++;else st.a++}}});

def({cat:SA,id:'change-notifier',name:'ChangeNotifier & ListenableBuilder',tags:'changenotifier notifylisteners listenablebuilder viewmodel rebuild scope listenable addlistener dispose built in state management',h:360,
blurb:'ChangeNotifier is a class from Flutter itself. You put your data and the methods that change it in a subclass (often your ViewModel), call notifyListeners() after each change, and wrap only the widgets that care in a ListenableBuilder. No package is needed.',
use:'Small and medium apps, ViewModels in an MVVM structure, any state that several widgets read.',
watch:'Wrap the smallest widget that needs the data. Wrapping the whole screen rebuilds all of it on every change. Expose lists as unmodifiable, call notifyListeners() only after a real change, and call dispose() when you own the notifier.',
ctl:[{k:'scope',l:'where ListenableBuilder sits',t:'sel',o:['around the whole screen','only around what changes'],v:'only around what changes'}],
render(s,st,g,d){
 if(!st.c){st.c={head:0,list:0,badge:0,total:0};st.n=0}
 const whole=s.scope.startsWith('around the whole');
 const cnt=k=>`<span style="font:600 10.5px var(--f-mono);background:var(--c3s);color:var(--c3t);border-radius:6px;padding:1px 6px">built ${st.c[k]}x</span>`;
 g.innerHTML=`<div style="position:absolute;inset:10px 14px;display:flex;flex-direction:column;gap:8px"><div class="fb a" style="justify-content:space-between;padding:0 12px;height:40px;border-radius:8px"><span>Shop ${cnt('head')}</span><span>Cart: <b>${st.n}</b> ${cnt('badge')}</span></div><div style="display:flex;flex-direction:column;gap:6px;flex:1">${['Coffee','Tea','Cake'].map((x,i)=>`<div class="li" style="border:1px solid var(--line);border-radius:8px;height:38px;justify-content:space-between"><span>${x}</span><span data-a="add" class="btn k-Outlined" style="padding:3px 12px;font-size:12px">Add</span></div>`).join('')}<div style="font:600 10.5px var(--f-mono);color:var(--muted)">list ${cnt('list')}</div></div><div class="fb c" style="height:34px;justify-content:space-between;padding:0 12px;border-radius:8px"><span>Total items: ${st.n}</span>${cnt('total')}</div></div>`;
 const w=`class CartViewModel extends ChangeNotifier {\n  int _count = 0;\n  int get count => _count;\n\n  void add() {\n    _count++;\n    notifyListeners();\n  }\n}\n\n// rebuilds EVERYTHING on each change\nListenableBuilder(\n  listenable: viewModel,\n  builder: (context, _) => Scaffold(\n    appBar: AppBar(title: Text('Cart: \${viewModel.count}')),\n    body: ProductList(onAdd: viewModel.add),\n  ),\n)`;
 const o=`class CartViewModel extends ChangeNotifier {\n  int _count = 0;\n  int get count => _count;\n\n  void add() {\n    _count++;\n    notifyListeners();\n  }\n}\n\nScaffold(\n  appBar: AppBar(\n    title: const Text('Shop'),     // not rebuilt\n    actions: [\n      ListenableBuilder(           // only this part\n        listenable: viewModel,\n        builder: (context, _) =>\n            Badge.count(count: viewModel.count),\n      ),\n    ],\n  ),\n  body: ProductList(onAdd: viewModel.add),  // not rebuilt\n)`;
 return {code:whole?w:o,hint:whole?'Every area is rebuilt on each Add, so every "built" counter goes up.':'Only the badge and the total are rebuilt. The header and the list stay at 1.'};
},
act(a,st,s){
 if(a!=='add')return;st.n++;const whole=s.scope.startsWith('around the whole');
 if(whole){st.c.head++;st.c.list++;st.c.badge++;st.c.total++}else{st.c.badge++;st.c.total++}
},
after(g,st,s,draw,d){if(!st.init){st.init=true;st.c.head=1;st.c.list=1;st.c.badge=1;st.c.total=1;draw()}}});

def({cat:SA,id:'state-packages',name:'Provider, Riverpod & Bloc',tags:'provider riverpod bloc cubit getx state management package compare choose dependency injection consumer watch read blocbuilder',h:340,
blurb:'When the built-in tools start to feel repetitive, a state management package helps. Flutter\'s own architecture guide recommends Provider for dependency injection, and says the choice of state management approach is largely a matter of preference. Riverpod and Bloc are the other widely used options.',
use:'Sharing and testing state across many screens, injecting repositories and services, and avoiding long chains of constructor parameters.',
watch:'Pick one approach for the whole project and keep it. Check each package\'s current docs, because APIs change between major versions. The examples show the same counter in each style and are a starting point.',
ctl:[{k:'p',l:'approach',t:'sel',o:['ChangeNotifier (built in)','Provider','Riverpod','Bloc / Cubit'],v:'Provider'}],
render(s,st,g,d){
 const I={
  'ChangeNotifier (built in)':['no package','You wire it yourself with ListenableBuilder','small apps, learning'],
  'Provider':['small','Wraps InheritedWidget. Simple to read','DI plus ChangeNotifier ViewModels'],
  'Riverpod':['medium','Providers live outside the widget tree and are compile-safe','async data, caching, testing'],
  'Bloc / Cubit':['more','Events or methods in, immutable states out','large teams, strict structure']};
 g.innerHTML=`<div class="fill" style="flex-direction:column;gap:7px;padding:10px">${Object.keys(I).map(k=>row(esc(k),'Boilerplate: '+I[k][0]+'. '+esc(I[k][1])+'. Good for: '+esc(I[k][2])+'.',k===s.p,'p'+k)).join('')}</div>`;
 const C={
  'ChangeNotifier (built in)':`class Counter extends ChangeNotifier {\n  int count = 0;\n  void increment() {\n    count++;\n    notifyListeners();\n  }\n}\n\nfinal counter = Counter();   // create and dispose it yourself\n\nListenableBuilder(\n  listenable: counter,\n  builder: (context, _) => Text('\${counter.count}'),\n)\nFilledButton(onPressed: counter.increment, child: Text('+1'))`,
  'Provider':`// pubspec.yaml: provider\nChangeNotifierProvider(\n  create: (_) => Counter(),\n  child: const MyApp(),\n)\n\n// read and rebuild when it changes\nText('\${context.watch<Counter>().count}')\n\n// call a method, no rebuild\nFilledButton(\n  onPressed: () => context.read<Counter>().increment(),\n  child: Text('+1'),\n)`,
  'Riverpod':`// pubspec.yaml: flutter_riverpod\nfinal counterProvider =\n    NotifierProvider<Counter, int>(Counter.new);\n\nclass Counter extends Notifier<int> {\n  @override\n  int build() => 0;\n  void increment() => state++;\n}\n\nvoid main() => runApp(const ProviderScope(child: MyApp()));\n\nclass CounterText extends ConsumerWidget {\n  const CounterText({super.key});\n  @override\n  Widget build(BuildContext context, WidgetRef ref) {\n    final count = ref.watch(counterProvider);\n    return FilledButton(\n      onPressed: () => ref.read(counterProvider.notifier).increment(),\n      child: Text('\$count'),\n    );\n  }\n}`,
  'Bloc / Cubit':`// pubspec.yaml: flutter_bloc\nclass CounterCubit extends Cubit<int> {\n  CounterCubit() : super(0);\n  void increment() => emit(state + 1);\n}\n\nBlocProvider(\n  create: (_) => CounterCubit(),\n  child: const MyApp(),\n)\n\nBlocBuilder<CounterCubit, int>(\n  builder: (context, count) => Text('\$count'),\n)\nFilledButton(\n  onPressed: () => context.read<CounterCubit>().increment(),\n  child: Text('+1'),\n)`};
 return {code:C[s.p],hint:'Click a card or use the menu. All four do the same job: hold the value, notify listeners, and rebuild only what reads it.'};
},
act(a,st,s){if(a[0]==='p'&&a.length>1){s.p=a.slice(1);const sel=document.querySelector('#state-packages .ctl select');if(sel)sel.value=s.p}}});

const LAYERS=[
 ['View','Widgets. Draw the screen and send user events to the ViewModel. No business logic.','ui/home/home_screen.dart','HomeScreen'],
 ['ViewModel','Holds screen state, exposes it to the View, turns events into repository calls.','ui/home/home_view_model.dart','HomeViewModel'],
 ['Repository','Single source of truth for one kind of data. Combines services, caches, maps API models to domain models.','data/repositories/user_repository.dart','UserRepository'],
 ['Service','Wraps one data source: an HTTP API, a database or a platform plugin. No app logic.','data/services/client_api_service.dart','ClientApiService']];
def({cat:SA,id:'mvvm-layers',name:'App architecture: View, ViewModel, Repository, Service',tags:'architecture mvvm layers ui data layer repository service viewmodel view clean separation of concerns unidirectional data flow dependency injection folder structure',h:350,
blurb:'Flutter\'s official architecture guide splits an app into a UI layer (Views and ViewModels) and a data layer (Repositories and Services). Data flows up from the services to the screen, and user events flow back down. Each class has one job, so each can be tested alone.',
use:'Any app that talks to an API or a database, or that will grow past a few screens.',
watch:'Widgets should hold almost no logic. Repositories should be abstract classes so you can swap in a fake for tests. Add a domain layer only when ViewModels get crowded or repeat logic. For most apps it adds overhead.',
ctl:[{k:'l',l:'layer',t:'sel',o:LAYERS.map(x=>x[0]),v:'ViewModel'}],
render(s,st,g,d){
 const i=LAYERS.findIndex(x=>x[0]===s.l),L=LAYERS[i];
 g.innerHTML=`<div class="fill" style="flex-direction:column;gap:0;padding:10px 14px;align-items:stretch"><div style="font:600 10.5px var(--f-mono);color:var(--muted);text-align:center">UI LAYER</div>${LAYERS.map((x,k)=>`${k===2?'<div style="font:600 10.5px var(--f-mono);color:var(--muted);text-align:center;margin-top:4px">DATA LAYER</div>':''}<div data-a="l${x[0]}" style="cursor:pointer;margin:3px 0;padding:8px 12px;border-radius:10px;border:1.5px solid ${k===i?'var(--c1)':'var(--line)'};background:${k===i?'var(--c1s)':'var(--surface)'};color:${k===i?'var(--c1t)':'var(--fg)'};display:flex;justify-content:space-between;font-size:13px"><b>${x[0]}</b><span style="font:11px var(--f-mono);opacity:.85">${x[3]}</span></div>${k<3?`<div style="text-align:center;font:10.5px var(--f-mono);color:var(--muted);line-height:1">&#8593; data &nbsp; &#8595; events</div>`:''}`).join('')}<div style="margin-top:6px;font-size:12.5px;color:var(--fg)"><b>${L[0]}:</b> ${esc(L[1])}<br><span style="font:11px var(--f-mono);color:var(--muted)">lib/${L[2]}</span></div></div>`;
 const C=[
  `class HomeScreen extends StatelessWidget {\n  const HomeScreen({super.key, required this.viewModel});\n  final HomeViewModel viewModel;\n\n  @override\n  Widget build(BuildContext context) {\n    return ListenableBuilder(\n      listenable: viewModel,\n      builder: (context, _) => switch (viewModel.state) {\n        Loading() => const CircularProgressIndicator(),\n        Data(:final value) => UserCard(user: value),\n        Failure(:final message) => Text(message),\n      },\n    );\n  }\n}`,
  `class HomeViewModel extends ChangeNotifier {\n  HomeViewModel({required UserRepository userRepository})\n      : _userRepository = userRepository;\n  final UserRepository _userRepository;\n\n  UiState<User> state = const Loading();\n\n  Future<void> load() async {\n    state = const Loading();\n    notifyListeners();\n    try {\n      state = Data(await _userRepository.getUser());\n    } on Exception catch (e) {\n      state = Failure(e.toString());\n    }\n    notifyListeners();\n  }\n}`,
  `abstract class UserRepository {\n  Future<User> getUser();\n}\n\nclass UserRepositoryRemote implements UserRepository {\n  UserRepositoryRemote({required ClientApiService apiService})\n      : _apiService = apiService;\n  final ClientApiService _apiService;\n\n  @override\n  Future<User> getUser() async {\n    final dto = await _apiService.fetchUser();   // API model\n    return User(id: dto.id, name: dto.name);     // domain model\n  }\n}`,
  `class ClientApiService {\n  ClientApiService({http.Client? client})\n      : _client = client ?? http.Client();\n  final http.Client _client;\n\n  Future<UserDto> fetchUser() async {\n    final res = await _client\n        .get(Uri.parse('https://api.example.com/user'));\n    if (res.statusCode != 200) {\n      throw ApiException(res.statusCode);\n    }\n    return UserDto.fromJson(\n      jsonDecode(res.body) as Map<String, dynamic>,\n    );\n  }\n}`];
 const wire=`\n\n// main.dart: wire the layers once (dependency injection)\nMultiProvider(\n  providers: [\n    Provider(create: (_) => ClientApiService()),\n    Provider<UserRepository>(\n      create: (c) => UserRepositoryRemote(\n        apiService: c.read<ClientApiService>(),\n      ),\n    ),\n  ],\n  child: const MyApp(),\n)`;
 return {code:C[i]+(i===3?wire:''),hint:'Click a layer. A class only talks to the layer directly below it, so the View never knows whether the data comes from an API, a database or a test fake.'};
},
act(a,st,s){if(a[0]==='l'&&a.length>1){s.l=a.slice(1);const sel=document.querySelector('#mvvm-layers .ctl select');if(sel)sel.value=s.l}}});

def({cat:SA,id:'ui-state',name:'Loading, data & error states',tags:'loading error empty state sealed class uistate result pattern matching switch expression async future snapshot booleans isloading haserror',h:330,
blurb:'Every screen that loads data is in one of a few states: loading, showing data, or showing an error. Model them as one sealed class, not as separate booleans like isLoading and hasError, and the screen cannot be in a state that makes no sense.',
use:'Any screen that fetches data from an API or a database.',
watch:'With separate booleans it is easy to be isLoading and hasError at the same time. A sealed class makes the compiler check that your switch handles every case (Dart 3). Remember an "empty" result is a valid Data state, not an error.',
ctl:[{k:'m',l:'how the state is modelled',t:'sel',o:['sealed class (best)','separate booleans (avoid)'],v:'sealed class (best)'}],
render(s,st,g,d){
 if(!st.s)st.s='idle';

def({cat:ND,id:'api-client',name:'Calling an API (http & Dio)',tags:'api http dio rest request response status code timeout exception jsonDecode interceptor headers base url client service network error handling',h:360,
blurb:'An API service is a plain class that makes the request, checks the status code, decodes the JSON and throws a clear exception when something goes wrong. The screen never sees http or Dio, only the typed result or the error.',
use:'Any call to a REST API: listing items, signing in, uploading data.',
watch:'Always set a timeout, always check the status code (http does not throw for 404 or 500), and always catch a bad JSON body. Keep the base URL and headers in one place. Do not call APIs from build().',
ctl:[{k:'c',l:'client',t:'sel',o:['http','dio'],v:'http'},{k:'r',l:'server answers',t:'sel',o:['200 OK','404 Not Found','500 Server Error','Timeout (no reply)','200 but broken JSON'],v:'200 OK'}],
render(s,st,g,d){
 const R={
  '200 OK':['200','ok','Returns the list. The screen shows 3 todos.'],
  '404 Not Found':['404','err','ApiException(404). The screen shows "Not found" and a retry button.'],
  '500 Server Error':['500','err','ApiException(500). Show a friendly message and offer a retry. Log the details.'],
  'Timeout (no reply)':['no reply','err','TimeoutException after 10 s. Tell the user to check the connection.'],
  '200 but broken JSON':['200','err','FormatException from jsonDecode. The server succeeded but the body is not valid, so treat it as an error.']}[s.r];
 const dio=s.c==='dio';
 const thrown=R[1]==='ok'?'(nothing thrown)':{'404 Not Found':dio?'DioException (badResponse, 404)':'ApiException(404)','500 Server Error':dio?'DioException (badResponse, 500)':'ApiException(500)','Timeout (no reply)':dio?'DioException (receiveTimeout)':'TimeoutException','200 but broken JSON':dio?'FormatException / TypeError':'FormatException'}[s.r];
 g.innerHTML=`<div style="position:absolute;inset:10px 14px;display:flex;flex-direction:column;gap:8px">${mono('<b>GET</b> https://api.example.com/todos','background:var(--c1s);color:var(--c1t);padding:6px 10px;border-radius:8px')}<div style="text-align:center;font:600 11px var(--f-mono);color:var(--muted)">&#8595; ${esc(R[0])} &#8595;</div>${mono('<b>'+esc(s.r)+'</b>','border:1.5px solid '+(R[1]==='ok'?'var(--ok)':'var(--danger)')+';border-radius:8px;padding:6px 10px;color:'+(R[1]==='ok'?'var(--ok)':'var(--danger)'))}${mono('throws: '+esc(thrown),'color:var(--muted)')}<div style="flex:1;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:10px;font-size:13px;display:flex;align-items:center">${R[1]==='ok'?'Coffee &middot; Tea &middot; Cake':esc(R[2])}</div></div>`;
 const http=`class ApiException implements Exception {\n  ApiException(this.statusCode);\n  final int statusCode;\n}\n\nclass ClientApiService {\n  ClientApiService({http.Client? client})\n      : _client = client ?? http.Client();\n  final http.Client _client;\n  static const _base = 'https://api.example.com';\n\n  Future<List<Todo>> fetchTodos() async {\n    final res = await _client\n        .get(\n          Uri.parse('$_base/todos'),\n          headers: {'Accept': 'application/json'},\n        )\n        .timeout(const Duration(seconds: 10));  // TimeoutException\n\n    if (res.statusCode != 200) {\n      throw ApiException(res.statusCode);       // http does NOT throw\n    }\n    final list = jsonDecode(res.body) as List<dynamic>;  // FormatException\n    return list\n        .map((e) => Todo.fromJson(e as Map<String, dynamic>))\n        .toList();\n  }\n}`;
 const dioC=`final dio = Dio(\n  BaseOptions(\n    baseUrl: 'https://api.example.com',\n    connectTimeout: const Duration(seconds: 10),\n    receiveTimeout: const Duration(seconds: 10),\n    headers: {'Accept': 'application/json'},\n  ),\n)..interceptors.add(\n    InterceptorsWrapper(\n      onRequest: (options, handler) {\n        options.headers['Authorization'] = 'Bearer $token';\n        handler.next(options);\n      },\n    ),\n  );\n\nFuture<List<Todo>> fetchTodos() async {\n  try {\n    final res = await dio.get<List<dynamic>>('/todos');\n    return res.data!\n        .map((e) => Todo.fromJson(e as Map<String, dynamic>))\n        .toList();\n  } on DioException catch (e) {\n    // Dio throws for 4xx/5xx and timeouts by default\n    throw ApiException(e.response?.statusCode ?? 0);\n  }\n}`;
 return {code:dio?dioC:http,hint:'Pick a server answer. The top shows what the client throws and the box shows what the user should see. Both packages are on pub.dev.'};
}});

 const C={
  'by hand':`@immutable\nclass Todo {\n  const Todo({required this.id, required this.title, required this.done});\n  final int id;\n  final String title;\n  final bool done;\n\n  ${hand.replace(/\n/g,'\n  ')}\n\n  Map<String, dynamic> toJson() =>\n      {'id': id, 'title': title, 'done': done};\n}`,
  'json_serializable':`// pubspec: json_annotation, dev: json_serializable, build_runner\nimport 'package:json_annotation/json_annotation.dart';\npart 'todo.g.dart';\n\n@JsonSerializable()\nclass Todo {\n  const Todo({required this.id, required this.title, this.done = false});\n  final int id;\n  final String title;\n  @JsonKey(defaultValue: false)${s.def?'':'  // only used when the key is missing'}\n  final bool done;\n\n  factory Todo.fromJson(Map<String, dynamic> json) => _$TodoFromJson(json);\n  Map<String, dynamic> toJson() => _$TodoToJson(this);\n}\n// dart run build_runner build`,
  'freezed':`// pubspec: freezed_annotation, json_annotation, dev: freezed, json_serializable, build_runner\n// (syntax of freezed 3, check the docs of your version)\npart 'todo.freezed.dart';\npart 'todo.g.dart';\n\n@freezed\nabstract class Todo with _$Todo {\n  const factory Todo({\n    required int id,\n    required String title,\n    @Default(false) bool done,\n  }) = _Todo;\n\n  factory Todo.fromJson(Map<String, dynamic> json) =>\n      _$TodoFromJson(json);\n}\n// gives you ==, hashCode, copyWith and toString\n// dart run build_runner build`};

 g.innerHTML=`<div style="position:absolute;inset:10px 14px;display:flex;flex-direction:column;gap:8px"><div style="display:flex;gap:8px;align-items:center"><span data-a="get" class="btn k-Filled" style="padding:6px 14px;font-size:13px">getTodos()</span><span style="font:11px var(--f-mono);color:var(--muted)">network: ${s.net} &middot; cache: ${st.has?'has data':'empty'}</span></div><div style="display:flex;gap:8px"><div class="fb ${s.net==='online'?'b':'d'}" style="flex:1;height:44px;border-radius:8px">API ${s.net==='online'?'(reachable)':'(unreachable)'}</div><div class="fb ${st.has?'c':'a'}" style="flex:1;height:44px;border-radius:8px">Local DB ${st.has?'(3 rows)':'(empty)'}</div></div><div style="flex:1;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:10px;font:12px/1.6 var(--f-mono);overflow:hidden">${st.log.slice(-7).map(esc).join('<br>')}</div></div>`;
 const code=`abstract class TodoRepository {\n  Future<List<Todo>> getTodos();\n}\n\nclass TodoRepositoryImpl implements TodoRepository {\n  TodoRepositoryImpl(this._api, this._dao);\n  final ClientApiService _api;   // remote\n  final TodoDao _dao;            // local (SQLite)\n\n  @override\n  Future<List<Todo>> getTodos() async {\n    try {\n      final fresh = await _api.fetchTodos();\n      await _dao.replaceAll(fresh);        // keep the copy up to date\n      return fresh;\n    } on Exception {\n      final cached = await _dao.getAll();  // fall back to the copy\n      if (cached.isNotEmpty) return cached;\n      rethrow;                             // nothing to show: report it\n    }\n  }\n}\n\n// test: no network needed\nclass FakeTodoRepository implements TodoRepository {\n  @override\n  Future<List<Todo>> getTodos() async => [Todo(id: 1, title: 'Test', done: false)];\n}`;

def({cat:ND,id:'data-best-practices',name:'API & database best practices: do and don\'t',tags:'best practice api key secret token security https isolate compute parsing futurebuilder cache sql injection migration error handling checklist',h:360,
blurb:'A checklist for the data layer. Pick a topic to see what to avoid, what to write instead, and why. Most of these mistakes work fine in a demo and fail later with real users.',
use:'Reviewing your own networking and database code, or a pull request.',
watch:'None of this replaces testing on a real device with a slow or missing network. Secrets cannot be hidden in a mobile app, so anything truly secret must stay on your server.',
ctl:[{k:'t',l:'topic',t:'sel',o:['API keys & secrets','Login tokens','Slow JSON parsing','Errors','Fetching in build()','SQL strings','Database changes','Plain http'],v:'API keys & secrets'}],

  'API keys & secrets':['const secretKey = \'sk_live_123\';   // in the app code','// keep the secret on your server; the app calls your server\nfinal res = await client.get(Uri.parse(\'https://api.example.com/payments\'));','Anyone can extract strings from an installed app, and --dart-define values are also inside the app. A secret in the app is public.'],
  'Login tokens':['await prefs.setString(\'token\', token);   // shared_preferences','await const FlutterSecureStorage()\n    .write(key: \'token\', value: token);','shared_preferences is plain text. Secure storage uses the Keychain or Keystore.'],
  'Slow JSON parsing':['final data = jsonDecode(hugeBody);   // blocks the UI thread','final data = await Isolate.run(() => jsonDecode(hugeBody));','Parsing a very large body on the main isolate drops frames. Isolate.run (Dart 2.19+) does it on another thread. Measure first, small bodies are fine.'],

use:'Moving between a few screens, opening a detail page, and asking a page for a value (a picker, a confirmation).',
watch:'After an await, check context.mounted before you use the context again. The last page cannot be popped. Pass real objects through a constructor when you can, because arguments are not type-checked. For deep links, the web, and many routes, use go_router.',
ctl:[{k:'pass',l:'how data travels',t:'sel',o:['nothing','constructor argument','RouteSettings arguments','result back'],v:'constructor argument'}],
render(s,st,g,d){
 if(!st.stack){st.stack=['Home'];st.n=0;st.msg=''}
 const nm=n=>s.pass==='constructor argument'?'DetailsPage(id: '+n+')':s.pass==='RouteSettings arguments'?'DetailsPage  arguments: '+n:'DetailsPage';
 const top=st.stack.length-1;
 g.innerHTML=nbx(`<div style="display:flex;gap:6px;flex-wrap:wrap">${nbtn('push','push','Filled')}${nbtn('pop','pop')}${nbtn('replace','pushReplacement')}${nbtn('clear','pushAndRemoveUntil')}</div><div style="font:600 10.5px var(--f-mono);color:var(--muted)">NAVIGATOR STACK (top first)</div>${st.stack.map((p,i)=>({p,i})).reverse().map(({p,i})=>ncard(i===top?'TOP · visible':'below',esc(p==='Home'?'HomePage':nm(p)),i===top)).join('')}<div style="font:12px/1.5 var(--f-mono);color:${st.msg?'var(--c3t)':'var(--muted)'}">${esc(st.msg||'Press a button to change the stack.')}</div>`);
 const push={'nothing':`Navigator.push(\n  context,\n  MaterialPageRoute(builder: (_) => const DetailsPage()),\n);`,'constructor argument':`Navigator.push(\n  context,\n  MaterialPageRoute(builder: (_) => DetailsPage(id: 7)),\n);\n\nclass DetailsPage extends StatelessWidget {\n  const DetailsPage({super.key, required this.id});\n  final int id;   // typed, checked by the compiler\n  ...\n}`,'RouteSettings arguments':`Navigator.pushNamed(context, '/details', arguments: 7);\n\n// inside DetailsPage.build\nfinal id = ModalRoute.of(context)!.settings.arguments as int;\n// a wrong type fails only when the app runs`,'result back':`// caller: wait for the answer\nfinal saved = await Navigator.push<String>(\n  context,\n  MaterialPageRoute(builder: (_) => const EditPage()),\n);\nif (!context.mounted) return;   // the page may be gone\nif (saved != null) showSaved(saved);\n\n// EditPage: give the answer back\nNavigator.pop(context, 'saved');`}[s.pass];
 return {code:push+`\n\n// go back\nNavigator.pop(context);\n// swap the top page (after login)\nNavigator.pushReplacement(context, route);\n// open a page and drop everything above Home\nNavigator.pushAndRemoveUntil(context, route, (r) => r.isFirst);`,hint:'Push and pop to watch the stack change. With "result back", pop sends a value to the code that is awaiting the push.'};
},
act(a,st,s){

}});

def({cat:NR,id:'go-router',name:'go_router: paths, parameters and go vs push',tags:'go_router gorouter goroute path parameters pathparameters queryparameters uri go push goNamed errorbuilder declarative routing url web back button sub route',h:420,

def({cat:AS,id:'form-flow',name:'Login flow: validate, submit, show errors',tags:'login form validation submit loading disabled button server error 401 422 field error formstate validator mounted double tap autovalidatemode signup flow textformfield',h:420,
blurb:'A real form is more than fields. It validates first, shows a loading state while it sends, blocks a second tap, and then shows the right error in the right place: under a field, or for the whole form.',
use:'Sign in, sign up, checkout, and any screen that sends data to a server.',
watch:'Disable the button while sending, or users send twice. Check mounted after every await. Validate on the client for speed, but trust the server for the final answer, because it can still say no. Do not tell the user which half was wrong on a login (wrong email or wrong password), because that helps attackers.',
ctl:[{k:'email',l:'email typed',t:'sel',o:['valid','empty','bad format'],v:'valid'},{k:'pw',l:'password typed',t:'sel',o:['ok','too short'],v:'ok'},{k:'val',l:'validate before sending',t:'chk',v:true},{k:'srv',l:'server answers',t:'sel',o:['success','wrong password (401)','email taken (field error)','no internet'],v:'success'}],
render(s,st,g,d){
 if(!st.phase)st.phase='idle';
 const ev={valid:'me@example.com',empty:'','bad format':'me@example'}[s.email];
 const eerr=st.phase==='invalid'&&s.val?(s.email==='empty'?'Enter your email':s.email==='bad format'?'Enter a valid email':''):(st.res==='taken'&&st.phase==='done'?'This email is already used':'');
 const perr=st.phase==='invalid'&&s.val&&s.pw==='too short'?'Use at least 8 characters':'';
 const fld=(l,v,e)=>`<div><div style="font-size:11.5px;color:var(--muted);margin-bottom:2px">${l}</div><div style="border:1.5px solid ${e?'var(--danger)':'var(--line)'};border-radius:8px;padding:6px 9px;font:13px var(--f-mono);min-height:18px;background:var(--surface)">${esc(v)||'&nbsp;'}</div>${e?`<div style="font-size:11.5px;color:var(--danger);margin-top:2px">${esc(e)}</div>`:''}</div>`;
 const ld=st.phase==='loading';
 const banner=st.phase==='done'?(st.res==='ok'?`<div class="okb" style="background:rgba(22,121,74,.1);border-color:var(--ok);color:var(--ok)">Signed in. The router goes to /home.</div>`:st.res==='401'?`<div class="erb">Wrong email or password.</div>`:st.res==='net'?`<div class="erb">No connection. Check the network and try again.</div>`:''):'';
 g.innerHTML=nbx(`${fld('Email',ev,eerr)}${fld('Password',s.pw==='ok'?'••••••••••':'•••',perr)}<div>${nbtn(ld?'x':'submit',ld?'Signing in...':'Sign in',ld?'Tonal':'Filled')}</div>${banner}<div style="font:11.5px/1.5 var(--f-mono);color:var(--muted)">state: ${esc(st.phase)}${ld?' (button disabled)':''}</div>`);
 const code=`final _key = GlobalKey<FormState>();\nbool _busy = false;\nString? _formError, _emailError;\n\nFuture<void> _submit() async {\n  ${s.val?`if (!_key.currentState!.validate()) return;   // shows field errors`:`// no client check: the server decides`}\n  setState(() { _busy = true; _formError = null; _emailError = null; });\n  try {\n    await auth.signIn(_email.text.trim(), _password.text);\n    if (!mounted) return;\n    context.go('/home');\n  } on InvalidCredentials {\n    setState(() => _formError = 'Wrong email or password.');\n  } on EmailTaken {\n    setState(() => _emailError = 'This email is already used');\n  } on NetworkException {\n    setState(() => _formError = 'No connection. Try again.');\n  } finally {\n    if (mounted) setState(() => _busy = false);\n  }\n}\n\nForm(\n  key: _key,\n  child: Column(children: [\n    TextFormField(\n      controller: _email,\n      keyboardType: TextInputType.emailAddress,\n      validator: (v) => (v == null || !v.contains('@')) ? 'Enter a valid email' : null,\n      decoration: InputDecoration(errorText: _emailError),\n    ),\n    TextFormField(\n      controller: _password,\n      obscureText: true,\n      validator: (v) => (v ?? '').length < 8 ? 'Use at least 8 characters' : null,\n    ),\n    FilledButton(\n      onPressed: _busy ? null : _submit,   // null disables it\n      child: Text(_busy ? 'Signing in...' : 'Sign in'),\n    ),\n  ]),\n);`;
 return {code,hint:'Set what the user typed and what the server will answer, then press Sign in. The button is disabled while the request runs.'};
},
act(a,st,s){
 if(a!=='submit')return;
 const bad=s.val&&(s.email!=='valid'||s.pw!=='ok');
 if(bad){st.phase='invalid';st.res=null;return}
 st.phase='loading';st.res=null;
},
after(g,st,s,draw){
 if(st.phase==='loading'&&!st.tm){st.tm=setTimeout(()=>{st.tm=0;if(!alive(g))return;st.res={'success':'ok','wrong password (401)':'401','email taken (field error)':'taken','no internet':'net'}[s.srv];st.phase='done';draw()},900)}
}});

def({cat:AS,id:'auth-tokens',name:'Tokens: store, refresh and log out',tags:'auth token jwt access refresh token flutter_secure_storage keychain keystore interceptor queuedinterceptor 401 logout sharedpreferences secure storage session',h:430,
blurb:'After login the server gives you an access token (short life) and often a refresh token (long life). You send the access token with each request. When it expires, a Dio interceptor uses the refresh token to get a new one and repeats the failed request, so the user never notices.',
use:'Any app with a login. This builds on the Dio page and the route guard page.',
watch:'Store tokens in flutter_secure_storage, not SharedPreferences. Refresh once at a time (QueuedInterceptor), or parallel 401s all refresh together. Use a separate Dio for the refresh call, or it loops. If the refresh fails, clear everything and send the user to login. Never log tokens.',
ctl:[{k:'sc',l:'situation',t:'sel',o:['token valid','access expired, refresh ok','refresh also expired','no token yet'],v:'access expired, refresh ok'},{k:'store',l:'where tokens are saved',t:'sel',o:['SharedPreferences','flutter_secure_storage'],v:'flutter_secure_storage'}],
render(s,st,g,d){
 const S={
  'token valid':[['GET /me  + Authorization: Bearer A1','200 OK','ok']],
  'access expired, refresh ok':[['GET /me  + Bearer A1 (expired)','401','err'],['interceptor: POST /auth/refresh  + R1','200  new A2, R2','ok'],['save A2, R2 in storage','done','ok'],['retry GET /me  + Bearer A2','200 OK','ok']],
  'refresh also expired':[['GET /me  + Bearer A1 (expired)','401','err'],['interceptor: POST /auth/refresh  + R1','401','err'],['clear tokens, set auth state to logged out','done','err'],['route guard redirects','/login','ok']],
  'no token yet':[['read token from storage','null','err'],['no request is sent','-','err'],['route guard redirects','/login','ok']]}[s.sc];
 const sec=s.store==='flutter_secure_storage';
 g.innerHTML=nbx(S.map(r=>`<div style="display:flex;gap:8px;align-items:center;border:1.5px solid ${r[2]==='ok'?'var(--line)':'var(--danger)'};border-radius:8px;padding:6px 10px;background:var(--surface)"><div style="flex:1;font:12px var(--f-mono);overflow-wrap:anywhere">${esc(r[0])}</div><div style="font:600 12px var(--f-mono);color:${r[2]==='ok'?'var(--ok)':'var(--danger)'};white-space:nowrap">${esc(r[1])}</div></div>`).join('')+`<div style="margin-top:auto;border-radius:8px;padding:8px 10px;font-size:12.5px;border:1.5px solid ${sec?'var(--ok)':'var(--danger)'};color:${sec?'var(--ok)':'var(--danger)'}">${sec?'Saved in the iOS Keychain or Android Keystore (encrypted by the system).':'Saved as plain text in a file. A rooted phone or a backup can read it.'}</div>`);
 const code=`final _store = ${sec?'const FlutterSecureStorage()':'await SharedPreferences.getInstance()   // not for secrets'};\n\nclass AuthInterceptor extends QueuedInterceptor {   // one request at a time\n  AuthInterceptor(this._dio, this._refreshDio);\n  final Dio _dio;\n  final Dio _refreshDio;   // a plain Dio WITHOUT this interceptor\n\n  @override\n  void onRequest(RequestOptions o, RequestInterceptorHandler h) async {\n    final token = await ${sec?"_store.read(key: 'access')":"_store.getString('access')"};\n    if (token != null) o.headers['Authorization'] = 'Bearer $token';\n    h.next(o);\n  }\n\n  @override\n  void onError(DioException e, ErrorInterceptorHandler h) async {\n    if (e.response?.statusCode != 401) return h.next(e);\n    try {\n      final refresh = await ${sec?"_store.read(key: 'refresh')":"_store.getString('refresh')"};\n      final res = await _refreshDio.post('/auth/refresh', data: {'refresh': refresh});\n      await ${sec?"_store.write(key: 'access', value: res.data['access'])":"_store.setString('access', res.data['access'])"};\n      final retry = await _dio.fetch(e.requestOptions);   // repeat the call\n      h.resolve(retry);\n    } catch (_) {\n      await auth.logout();   // clears storage, the guard sends to /login\n      h.next(e);\n    }\n  }\n}`;
 return {code,hint:'Pick a situation to see the calls in order. Red rows are failures. Switch the storage to compare how safe it is.'};
}});

def({cat:AS,id:'project-structure',name:'Project structure: feature-first or layer-first',tags:'folder structure project layout feature first layer first lib organization modules scalable naming barrel domain data presentation core shared',h:420,
blurb:'There are two common ways to organise lib/. Layer-first groups files by type (all screens together, all models together). Feature-first groups by feature (everything for login together). Feature-first keeps related code close and scales better.',
use:'Starting a new app, or when lib/ has become hard to navigate.',
watch:'Pick one and stay consistent. Shared code goes in a core or shared folder, and only after two features need it. Features should not import each other\'s internals. The Flutter architecture guide organises by feature, with layers inside.',
ctl:[{k:'style',l:'structure',t:'sel',o:['layer-first','feature-first'],v:'feature-first'},{k:'size',l:'app size',t:'sel',o:['small (3 screens)','large (20 screens)'],v:'large (20 screens)'}],
render(s,st,g,d){
 const big=s.size[0]==='l';
 const layer=['lib/','  main.dart','  screens/','    login_screen.dart','    home_screen.dart','    '+(big?'... 18 more screens':'profile_screen.dart'),'  models/','    user.dart','    '+(big?'... 15 more models':'todo.dart'),'  services/','    api_client.dart','    '+(big?'... 9 more services':'auth_service.dart'),'  widgets/','    '+(big?'... 30 shared widgets':'primary_button.dart')];
 const feat=['lib/','  main.dart','  core/','    api_client.dart','    theme.dart','    router.dart','  features/','    auth/','      data/  auth_repository.dart','      domain/  user.dart','      ui/  login_screen.dart  login_view_model.dart',big?'    profile/  (data, domain, ui)':'    home/  (ui)',big?'    orders/   (data, domain, ui)':'',big?'    ... 15 more features':''].filter(x=>x!=='');
 const T=s.style==='layer-first'?layer:feat;
 const note=s.style==='layer-first'?(big?'To change "orders" you open 5 different folders. Folders become long lists.':'Fine for a small app. Easy to start with.'):(big?'Everything for "orders" is in one folder. A team can own a feature.':'Slightly more folders than you need for 3 screens, but easy to grow.');
 g.innerHTML=nbx(`<pre style="margin:0;flex:1;overflow:auto;font:12px/1.55 var(--f-mono);background:var(--code-bg);color:var(--code-fg);padding:10px;border-radius:8px">${esc(T.join('\n'))}</pre><div style="font-size:12.5px;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)">${esc(note)}</div>`);
 const code=s.style==='layer-first'?`lib/\n  main.dart\n  screens/    // every screen\n  models/     // every model\n  services/   // every service\n  widgets/    // shared widgets\n\n// Good for: small apps, tutorials, prototypes.\n// Gets hard when: many screens, many developers.`:`lib/\n  main.dart\n  core/        // used by many features: theme, router, http client\n  features/\n    auth/\n      data/    // repository, DTOs, API calls\n      domain/  // models (and use cases if you need them)\n      ui/      // screens, widgets, view models\n    orders/\n      data/\n      domain/\n      ui/\n\n// Rule: a feature may import core/, not another feature's data/.\n// Share a model between features? Move it to core/ or a shared package.`;
 return {code,hint:'Switch between the two layouts and the app size. The tree grows quickly in the layer-first version.'};
}});

def({cat:AS,id:'dependency-injection',name:'Dependency injection and fakes',tags:'dependency injection di provider get_it service locator riverpod constructor injection fake mock test repository interface abstract class inversion testing',h:410,
blurb:'A class should receive the things it needs (its dependencies) instead of creating them. Then you can give it the real repository in the app and a fake one in tests or while the backend is not ready.',
use:'Any ViewModel, Bloc or service that talks to a repository, API or database.',
watch:'Start with plain constructor parameters, because they are the simplest and need no package. Provider or Riverpod pass objects down the widget tree. get_it is a global service locator that is quick to use but hides dependencies. Do not call a locator inside widgets everywhere, because it is hard to test.',
ctl:[{k:'impl',l:'which repository',t:'sel',o:['real (API)','fake (tests, demos)'],v:'real (API)'},{k:'how',l:'how it is passed',t:'sel',o:['constructor','Provider','get_it'],v:'constructor'}],
render(s,st,g,d){
 const fake=s.impl[0]==='f';
 g.innerHTML=nbx(ncard('UserViewModel','needs a <b>UserRepository</b>. It does not know which one.',1)+narrow+ncard('abstract class UserRepository','Future&lt;User&gt; getUser(int id)',0)+narrow+`<div style="display:flex;gap:8px"><div style="flex:1;opacity:${fake?.45:1}">${ncard('ApiUserRepository','Dio call to the server',!fake,'var(--ok)')}</div><div style="flex:1;opacity:${fake?1:.45}">${ncard('FakeUserRepository','returns a fixed User',fake,'var(--ok)')}</div></div><div style="margin-top:auto;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;background:var(--surface)">Screen shows: <b>${fake?'Ada (fake data, instant, no network)':'Taufiq (from the server, needs network)'}</b></div>`);
 const pick=fake?'FakeUserRepository()':'ApiUserRepository(dio)';
 const C={
  'constructor':`abstract class UserRepository {\n  Future<User> getUser(int id);\n}\n\nclass UserViewModel extends ChangeNotifier {\n  UserViewModel(this._repo);          // dependency comes in\n  final UserRepository _repo;\n  ...\n}\n\n// in main() or the composition root\nfinal vm = UserViewModel(${pick});`,
  'Provider':`void main() => runApp(\n  MultiProvider(\n    providers: [\n      Provider<UserRepository>(create: (_) => ${pick}),\n      ChangeNotifierProvider(\n        create: (c) => UserViewModel(c.read<UserRepository>()),\n      ),\n    ],\n    child: const MyApp(),\n  ),\n);\n\n// in a widget\nfinal vm = context.watch<UserViewModel>();`,
  'get_it':`final getIt = GetIt.instance;\n\nvoid setupLocator() {\n  getIt.registerLazySingleton<UserRepository>(() => ${pick});\n  getIt.registerFactory(() => UserViewModel(getIt<UserRepository>()));\n}\n\n// main(): call setupLocator() first\nfinal vm = getIt<UserViewModel>();\n\n// in a test: register the fake instead\n// getIt.registerSingleton<UserRepository>(FakeUserRepository());`}[s.how];
 return {code:C,hint:'Swap the repository and watch the ViewModel stay unchanged. Only the one line that creates the repository changes.'};
}});

def({cat:AS,id:'clean-architecture',name:'Clean Architecture in Flutter (and when it is too much)',tags:'clean architecture domain data presentation use case usecase entity repository interface dependency rule uncle bob layers mvvm bloc dto mapper boilerplate onion hexagonal',h:440,
blurb:'Clean Architecture splits an app into presentation, domain and data layers, with one rule: dependencies point inward. The domain layer (entities, use cases and repository interfaces) is plain Dart and imports nothing from Flutter or from your data code.',
use:'Large apps with complex business rules, several data sources, or many developers. It also helps when the business logic must be tested without Flutter.',
watch:'It adds many files: DTOs, entities, mappers, use cases. A use case that only forwards one call is noise. Flutter\'s own architecture guide recommends MVVM with UI and data layers, and a domain layer only when logic is complex. Start simple and add layers when you feel the pain.',
ctl:[{k:'style',l:'approach',t:'sel',o:['MVVM (Flutter guide)','Clean Architecture'],v:'Clean Architecture'},{k:'piece',l:'where does this live?',t:'sel',o:['UserDto','User (entity)','GetUserUseCase','UserRepository (interface)','UserRepositoryImpl','UserViewModel / Bloc','UserPage'],v:'GetUserUseCase'}],
render(s,st,g,d){
 const L={'UserDto':'data','User (entity)':'domain','GetUserUseCase':'domain','UserRepository (interface)':'domain','UserRepositoryImpl':'data','UserViewModel / Bloc':'presentation','UserPage':'presentation'}[s.piece];
 const clean=s.style==='Clean Architecture';
 const imp={presentation:'domain (and Flutter)',domain:'nothing. Plain Dart only.',data:'domain (to implement its interfaces), plus Dio, drift, JSON'}[L];
 const layer=(n,sub,hit,dash)=>`<div style="border:${dash?'1.5px dashed':'1.5px solid'} ${hit?'var(--c1)':'var(--line)'};background:${hit?'var(--c1s)':'var(--surface)'};border-radius:9px;padding:7px 10px;opacity:${dash?.7:1}"><div style="font:700 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)">${n}${hit?' &larr; here':''}</div><div style="font:12px/1.5 var(--f-mono)">${sub}</div></div>`;
 g.innerHTML=nbx(layer('Presentation','pages, widgets, ViewModel or Bloc',L==='presentation')+`<div style="text-align:center;font:11px var(--f-mono);color:var(--muted)">&#8595; depends on &#8595;</div>`+layer('Domain'+(clean?'':' (optional)'),clean?'entities, use cases, repository interfaces':'only when logic is complex: merge or reuse across screens',L==='domain',!clean)+`<div style="text-align:center;font:11px var(--f-mono);color:var(--muted)">&#8593; implements &#8593;</div>`+layer('Data','DTOs, repository implementations, API, database',L==='data')+`<div style="margin-top:auto;font-size:12.5px;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)"><b>${esc(s.piece)}</b> belongs in <b>${L}</b>. It may import: ${esc(imp)}${!clean&&s.piece.includes('UseCase')?'<br>In MVVM, call the repository from the ViewModel, unless the logic is reused or complex.':''}</div>`);
 const code=clean?`lib/\n  features/user/\n    domain/\n      user.dart                 // entity: plain Dart\n      user_repository.dart      // abstract class\n      get_user.dart             // use case\n    data/\n      user_dto.dart             // fromJson, toDomain()\n      user_repository_impl.dart\n    presentation/\n      user_page.dart\n      user_view_model.dart\n\n// domain/user_repository.dart (no Flutter, no Dio)\nabstract class UserRepository {\n  Future<User> getUser(int id);\n}\n\n// domain/get_user.dart\nclass GetUser {\n  GetUser(this._repo);\n  final UserRepository _repo;\n  Future<User> call(int id) => _repo.getUser(id);   // add real rules here\n}\n\n// data/user_repository_impl.dart\nclass UserRepositoryImpl implements UserRepository {\n  UserRepositoryImpl(this._api);\n  final UserApi _api;\n  @override\n  Future<User> getUser(int id) async => (await _api.getUser(id)).toDomain();\n}`:`lib/\n  features/user/\n    data/\n      user_repository.dart      // Dio + cache, returns User\n    ui/\n      user_page.dart\n      user_view_model.dart      // calls the repository\n\n// No use case unless one is needed:\nclass UserViewModel extends ChangeNotifier {\n  UserViewModel(this._repo);\n  final UserRepository _repo;\n  Future<void> load(int id) async { user = await _repo.getUser(id); notifyListeners(); }\n}\n// Add a domain/ folder with use cases later, for logic several\n// ViewModels share. This is the path the Flutter guide suggests.`;
 return {code,hint:'Pick a piece and see which layer owns it and what it may import. Switch to MVVM to see the lighter version, where the domain layer is optional.'};
}});
